    /* ---------- Reservations ---------- */
    function alertBanner() {
      var state = alertsState();
      if (state === 'install') {
        return '<div class="banner"><div class="grow">To get alerts on this iPhone, tap the Share button, then <b>Add to Home Screen</b>, and open Belle from there.</div></div>';
      }
      if (state === 'off') return '<div class="banner"><div class="grow">Alerts are off on this phone, so new reservations will not ring.</div><button data-action="alertsOn">Turn on</button></div>';
      if (state === 'blocked') return '<div class="banner"><div class="grow">Alerts are blocked. Open Settings, then Notifications, then Belle, and allow them.</div></div>';
      if (state === 'old') return '<div class="banner"><div class="grow">Alerts need iOS 16.4 or later. Update this iPhone in Settings, then General, then Software Update.</div></div>';
      return '';
    }

    function reservationsHtml() {
      var rows = allBookings();
      var today = colomboDay(0);
      var lists = {
        reply: waiting(rows),
        today: rows.filter(function (b) { return b.date === today && !b.isCancelled; }),
        upcoming: rows.filter(function (b) { return b.date > today && !b.isCancelled; })
      };
      var empty = { reply: 'No requests are waiting for a reply.', today: 'No tables booked for today.', upcoming: 'No reservations after today.' };
      var labels = { reply: 'Needs a reply', today: 'Today', upcoming: 'Upcoming' };
      var unmarked = rows.filter(function (b) { return b.date < today && b.status === 'confirmed'; });
      var shown = lists[view.list];
      var body;
      if (!bookingsLoaded) body = '<p class="empty">' + (link === 'offline' ? 'No connection. The list loads when the phone is back online.' : 'Loading reservations…') + '</p>';
      else if (!shown.length) body = '<p class="empty">' + empty[view.list] + '</p>';
      else body = shown.map(function (b) { return bookingCard(b, view.list !== 'today'); }).join('');
      if (view.list === 'today' && bookingsLoaded && unmarked.length) {
        body += '<h2 class="section">Still to mark from yesterday</h2>' + unmarked.map(function (b) { return bookingCard(b, true); }).join('');
      }
      return topBar('Reservations', { id: 'linkText', text: linkText() }, '', moreButton()) +
        '<div class="segments">' + ['reply', 'today', 'upcoming'].map(function (k) {
          var n = lists[k].length;
          return '<button class="seg' + (view.list === k ? ' on' : '') + '" data-action="list" data-list="' + k + '">' + labels[k] + (bookingsLoaded && n ? ' · ' + n : '') + '</button>';
        }).join('') + '</div>' +
        '<main class="page">' + alertBanner() + body + '</main>' +
        '<button class="fab" data-action="go" data-to="booking-new">' + '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">' + ICONS.plus + '</svg>Add</button>' +
        tabBar('reservations');
    }

    function bookingCard(b, showDay) {
      var today = colomboDay(0);
      var facts = [plural(b.party, 'guest'), b.table && 'Table ' + b.table, b.occasion, b.event, b.note].filter(Boolean).join(' · ');
      var canMark = b.status === 'confirmed' && b.date <= today;
      var buttons = '';
      if (b.needsTelling) {
        buttons += '<button class="btn primary" data-action="tell" data-id="' + esc(b.id) + '">Tell the guest</button>';
        if (b.isCancelled) buttons += '<button class="btn" data-action="told" data-id="' + esc(b.id) + '">Already told</button>';
      }
      if (b.status === 'requested') {
        buttons += '<button class="btn primary" data-action="status" data-status="confirmed" data-id="' + esc(b.id) + '">Confirm</button>' +
          '<button class="btn danger" data-action="status" data-status="declined" data-id="' + esc(b.id) + '">Decline</button>';
      } else if (canMark) {
        buttons += '<button class="btn" data-action="status" data-status="arrived" data-id="' + esc(b.id) + '">Arrived</button>' +
          '<button class="btn" data-action="status" data-status="noshow" data-id="' + esc(b.id) + '">No-show</button>';
      }
      return '<article class="card tap" data-action="go" data-to="booking/' + encodeURIComponent(b.id) + '">' +
        '<div class="row"><span class="time">' + esc(timeText(b.time)) + '</span><span class="name grow">' + esc(b.name || 'No name') + '</span>' + chip(b) + '</div>' +
        (showDay ? '<div style="margin-top:4px">' + esc(dayText(b.date)) + '</div>' : '') +
        '<div class="muted clip2" style="margin-top:4px">' + esc(facts) + '</div>' +
        (buttons ? '<div class="actions">' + buttons + '</div>' : '') +
      '</article>';
    }

    function bookingHtml(id) {
      var b = findBooking(id);
      if (!b) {
        if (!bookingsLoaded) return topBar('Reservation', null, backButton()) + '<main class="page"><p class="empty">Loading…</p></main>';
        loadOldBooking(id);
        return topBar('Reservation', null, backButton()) + '<main class="page"><p class="empty" id="oldBooking">Loading…</p></main>';
      }
      var today = colomboDay(0);
      var buttons = '';
      if (b.needsTelling) {
        buttons += '<button class="btn primary block" data-action="tell" data-id="' + esc(id) + '">Tell the guest on WhatsApp</button>';
        if (b.isCancelled) buttons += '<button class="btn block" data-action="told" data-id="' + esc(id) + '">Already told them</button>';
      }
      function act(status, label, style) {
        return '<button class="btn block ' + (style || '') + '" data-action="status" data-status="' + status + '" data-id="' + esc(id) + '">' + label + '</button>';
      }
      if (b.status === 'requested') buttons += act('confirmed', 'Confirm', 'primary') + act('declined', 'Decline', 'danger');
      else if (b.status === 'confirmed') {
        if (b.date <= today) buttons += act('arrived', 'Arrived', b.needsTelling ? '' : 'primary') + act('noshow', 'No-show');
        buttons += act('cancelled', 'Cancel it', 'danger');
      } else buttons += act('confirmed', 'Put back as confirmed');
      var contact = '';
      if (b.digits.length >= 9 && !b.needsTelling) contact += '<a class="btn" href="https://wa.me/' + b.digits + '" target="_blank" rel="noopener">WhatsApp</a>';
      if (b.digits.length >= 7) contact += '<a class="btn" href="tel:+' + b.digits + '">Call</a>';
      if (b.email) contact += '<a class="btn" href="mailto:' + esc(b.email) + '">Email</a>';
      var facts = [
        ['Guests', String(b.party)], ['Table', b.table], ['WhatsApp', b.phone], ['Email', b.email], ['Occasion', b.occasion],
        ['For the event', b.event], ['Note from the guest', b.note], ['Note for staff', b.staffNote]
      ].filter(function (f) { return f[1]; });
      var about = [b.reference && 'Ref ' + b.reference, b.source === 'website' ? 'From the website' : 'Added by staff', b.createdAt && 'Received ' + moment(b.createdAt)].filter(Boolean);
      return topBar(b.name || 'Reservation', null, backButton(),
        '<button class="icon-btn" data-action="go" data-to="booking-edit/' + encodeURIComponent(id) + '" aria-label="Change details">' + icon('edit') + '</button>') +
        '<main class="page form">' +
          '<div class="row" style="margin-top:4px">' + chip(b) + '</div>' +
          '<h2 style="font-size:22px;font-weight:500;margin-top:10px">' + esc(longDay(b.date) + ' at ' + timeText(b.time) + ', ' + plural(b.party, 'guest')) + '</h2>' +
          '<p class="muted" style="margin-top:6px">' + esc(about.join(' · ')) + '</p>' +
          '<div class="stack">' + buttons + '</div>' +
          (contact ? '<h3 class="section">Contact the guest</h3><div class="actions" style="margin-top:0">' + contact + '</div>' : '') +
          '<div class="facts">' + facts.map(function (f) { return '<div><span>' + esc(f[0]) + '</span>' + esc(f[1]) + '</div>'; }).join('') + '</div>' +
          '<button class="btn block" data-action="go" data-to="booking-edit/' + encodeURIComponent(id) + '">Change date, time, table or notes</button>' +
        '</main>';
    }

    // A booking older than yesterday is not in the live list, so it is read once by itself
    var oldBookings = {};
    function loadOldBooking(id) {
      if (oldBookings[id]) return;
      oldBookings[id] = true;
      getIdToken().then(function (token) { return request(dbUrl('belle_reservations/' + id, { auth: token })); }).then(function (res) {
        if (!res.ok) throw failed(res);
        return res.json();
      }).then(function (data) {
        if (data) {
          tree[id] = data;
          dataChanged();
        } else {
          var el = document.getElementById('oldBooking');
          if (el) el.textContent = 'This reservation no longer exists.';
        }
      }, function (err) {
        var el = document.getElementById('oldBooking');
        if (el) el.textContent = errorText(err);
      });
    }

    function bookingFormHtml(id) {
      var b = id ? findBooking(id) : null;
      if (id && !b) return topBar('Change details', null, backButton()) + '<main class="page"><p class="empty">This reservation is not loaded. Go back and open it again.</p></main>';
      function field(label, name, value, attrs, hint) {
        return '<label class="field"><span>' + label + '</span><input name="' + name + '" value="' + esc(value) + '" ' + (attrs || '') + ' />' + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
      }
      function area(label, name, value, max, hint) {
        return '<label class="field"><span>' + label + '</span><textarea name="' + name + '" maxlength="' + max + '" rows="2">' + esc(value) + '</textarea>' + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
      }
      return topBar(id ? 'Change details' : 'Add a reservation', null, backButton()) +
        '<main class="page form"><form id="bookingForm" data-id="' + esc(id || '') + '" novalidate>' +
          (id ? '' : '<p class="muted" style="margin-bottom:14px">For a guest who called or walked in. It is saved as confirmed.</p>') +
          '<div class="pair">' + field('Date', 'date', b ? b.date : colomboDay(0), 'type="date" required') + field('Time', 'time', b ? b.time : '19:00', 'type="time" required') + '</div>' +
          '<div class="pair">' + field('Guests', 'party', b ? b.party : 2, 'type="number" inputmode="numeric" min="1" max="100"') + field('Table', 'table', b ? b.table : '', 'maxlength="40"') + '</div>' +
          field('Name', 'name', b ? b.name : '', 'maxlength="80" autocapitalize="words"') +
          field('WhatsApp number', 'phone', b ? b.phone : '', 'type="tel" maxlength="24"', 'Include the country code, for example +94 77 123 4567.') +
          field('Email', 'email', b ? b.email : '', 'type="email" maxlength="120" autocapitalize="none"') +
          field('Occasion', 'occasion', b ? b.occasion : '', 'maxlength="40"') +
          area('Note from the guest', 'note', b ? b.note : '', 500) +
          area('Note for staff', 'staffNote', b ? b.staffNote : '', 500, 'Guests never see this. Nor the table.') +
          '<p class="error" id="formError" hidden></p>' +
          '<button class="btn primary block" id="formSave">' + (id ? 'Save changes' : 'Add reservation') + '</button>' +
        '</form></main>';
    }

    function saveBooking(form) {
      var id = form.getAttribute('data-id');
      var v = function (name) { return form.elements[name].value.trim(); };
      var party = parseInt(v('party'), 10);
      var problem = !v('date') ? 'Choose a date.' : !/^\d{2}:\d{2}$/.test(v('time')) ? 'Choose a time.'
        : !(party >= 1 && party <= 100) ? 'Enter between 1 and 100 guests.' : !v('name') ? 'Enter a name.'
        : v('phone') && v('phone').length < 7 ? 'That WhatsApp number looks too short. Leave it empty if you do not have one.' : '';
      var error = document.getElementById('formError');
      error.hidden = !problem;
      error.textContent = problem;
      if (problem) return;
      // An empty field is removed from the booking, as in the admin panel
      var fields = { date: v('date'), time: v('time'), party: party, name: v('name') };
      ['phone', 'email', 'table', 'occasion', 'note', 'staffNote'].forEach(function (k) { fields[k] = v(k) || null; });
      var button = document.getElementById('formSave');
      button.disabled = true;
      button.textContent = 'Saving…';
      var job;
      if (id) {
        job = patchBooking(id, fields).then(function () { toast('Saved.'); });
      } else {
        var entry = { reference: newReference(), status: 'confirmed', source: 'staff', createdAt: Date.now() };
        Object.keys(fields).forEach(function (k) { if (fields[k] !== null) entry[k] = fields[k]; });
        job = dbWrite('POST', 'belle_reservations', entry).then(function () { toast('Reservation added.'); });
      }
      job.then(function () { back(id ? 'booking/' + encodeURIComponent(id) : ''); }, function (err) {
        error.hidden = false;
        error.textContent = errorText(err);
        button.disabled = false;
        button.textContent = id ? 'Save changes' : 'Add reservation';
      });
    }

    function newReference() {
      var letters = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      var random = crypto.getRandomValues(new Uint8Array(5));
      return 'BC-' + Array.prototype.map.call(random, function (n) { return letters[n % letters.length]; }).join('');
    }

    /* ---------- Events ---------- */
    function eventsHtml() {
      var canEdit = editsEvents(session.role);
      if (!eventsLoaded && !eventsFailed) refreshEvents().catch(function () {});
      var upcoming = events.filter(function (ev) { return eventState(ev) === 'upcoming'; }).sort(function (a, b) { return a.dateStr < b.dateStr ? -1 : 1; });
      var undated = events.filter(function (ev) { return eventState(ev) === 'nodate'; });
      var past = events.filter(function (ev) { return eventState(ev) === 'past'; }).sort(function (a, b) { return a.dateStr > b.dateStr ? -1 : 1; });
      var body = canEdit ? '' : '<p class="info">You can see the events here, but only Main admin and Full access accounts can add or delete them.</p>';
      if (!eventsLoaded) body += '<p class="empty">' + (eventsFailed ? 'Could not load the events. Check the internet connection, then tap Events to try again.' : 'Loading events…') + '</p>';
      else if (!events.length) body += '<p class="empty">' + (canEdit ? 'No events yet. Tap Add event to put one on the calendar.' : 'No events yet.') + '</p>';
      else {
        if (!upcoming.length) body += '<p class="empty">Nothing coming up, so guests see an empty Event Calendar.</p>';
        var month = '';
        upcoming.forEach(function (ev) {
          var d = parseDay(ev.dateStr);
          var title = MONTH_NAMES[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
          if (title !== month) {
            month = title;
            body += '<h2 class="section">' + title + '</h2>';
          }
          body += eventCard(ev, canEdit);
        });
        if (undated.length) body += '<h2 class="section">Needs a date</h2><p class="note">These were saved without a year, so guests see them on that day every year. Open one and pick the date.</p>' + undated.map(function (ev) { return eventCard(ev, canEdit); }).join('');
        if (past.length) body += '<h2 class="section">Past</h2><p class="note">Guests no longer see these.</p>' + past.map(function (ev) { return eventCard(ev, canEdit); }).join('');
      }
      return topBar('Events', { text: 'The Event Calendar on the website' }, '', moreButton()) +
        '<main class="page">' + body + '</main>' +
        (canEdit ? '<button class="fab" data-action="go" data-to="event-new"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">' + ICONS.plus + '</svg>Add event</button>' : '') +
        tabBar('events');
    }

    function eventCard(ev, canEdit) {
      var d = parseDay(ev.dateStr);
      var month = d ? MONTHS[d.getUTCMonth()] : str(ev.month).toUpperCase();
      var dayNum = d ? d.getUTCDate() : str(ev.day);
      var weekday = d ? WEEKDAYS[d.getUTCDay()] : str(ev.dow).toUpperCase();
      var type = eventType(ev);
      var facts = [ev.time, ev.venue].filter(function (x) { return x && String(x).trim(); }).join(' · ');
      return '<article class="card' + (canEdit ? ' tap' : '') + (eventState(ev) === 'past' ? ' past' : '') + '"' + (canEdit ? ' data-action="go" data-to="event/' + encodeURIComponent(ev.id) + '"' : '') + '>' +
        '<div class="row" style="align-items:flex-start">' +
          '<div class="datebox"><span>' + esc(month) + '</span><b>' + esc(dayNum || '?') + '</b><span>' + esc(weekday) + '</span></div>' +
          '<div class="grow"><div style="font-size:17px;font-weight:600" class="clip2">' + esc(ev.title || 'Unnamed event') + '</div>' +
            (facts ? '<div class="muted clip2" style="margin-top:2px">' + esc(facts) + '</div>' : '') +
            '<div class="tags"><span class="chip">' + esc(type ? type.label : cap(str(ev.categoryLabel))) + '</span>' + (ev.isVip ? '<span class="chip strong">Special</span>' : '') + '</div></div>' +
          (ev.imageData ? '<img class="thumb" alt="" data-photo="' + esc(ev.imageData) + '" />' : '') +
        '</div>' +
        (canEdit ? '<div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="btn text danger" data-action="deleteEvent" data-id="' + esc(ev.id) + '">Delete</button></div>' : '') +
      '</article>';
    }

    // An event's time is free text on the website, such as "7:00 PM – 10:00 PM"
    var ONE_TIME = '(\\d{1,2})(?:[:.](\\d{2}))?\\s*([AaPp])\\.?\\s*[Mm]\\.?';
    var WHOLE_TIME = new RegExp('^\\s*' + ONE_TIME + '\\s*(?:(?:–|—|-|to)\\s*' + ONE_TIME + ')?\\s*$');
    function clock(h, m, half) {
      h = +h; m = m === undefined || m === '' ? 0 : +m;
      if (!(h >= 1 && h <= 12) || !(m >= 0 && m <= 59)) return null;
      var h24 = (h % 12) + (/p/i.test(half) ? 12 : 0);
      return (h24 < 10 ? '0' : '') + h24 + ':' + (m < 10 ? '0' : '') + m;
    }
    function parseEventTime(text) {
      if (!String(text || '').trim()) return ['19:00', '22:00'];
      var m = WHOLE_TIME.exec(text);
      if (!m) return null;
      var start = clock(m[1], m[2], m[3]);
      if (!start) return null;
      if (!m[4]) return [start, ''];
      var end = clock(m[4], m[5], m[6]);
      return end ? [start, end] : null;
    }
    function eventTimeText(start, end) { return end ? timeText(start) + ' – ' + timeText(end) : timeText(start); }

    var eventDraft = null;

    function eventFormHtml(id) {
      var ev = id ? events.find(function (e) { return e.id === id; }) : null;
      if (id && !ev) {
        if (!eventsLoaded) refreshEvents().then(function () { drawn = ''; render(); }, function () {});
        return topBar('Event', null, backButton()) + '<main class="page"><p class="empty">' + (eventsLoaded ? 'This event no longer exists. Someone may have deleted it.' : 'Loading…') + '</p></main>';
      }
      var times = parseEventTime(ev ? ev.time : '');
      eventDraft = { id: id, existing: ev, photoSrc: ev ? str(ev.imageData) : '', picked: null, preparing: false, special: !!(ev && ev.isVip), category: (ev && ev.category) || 'dining', freeTime: times ? null : str(ev.time) };
      var venues = [];
      events.concat([{ venue: DEFAULT_VENUE }]).forEach(function (e) {
        var v = str(e.venue).trim();
        if (v && venues.every(function (x) { return x.toLowerCase() !== v.toLowerCase(); })) venues.push(v);
      });
      var today = colomboDay(0);
      return topBar(ev ? 'Change event' : 'Add an event', null, backButton()) +
        '<main class="page form"><form id="eventForm" novalidate>' +
          (ev ? '' : '<p class="muted" style="margin-bottom:14px">It goes on the Event Calendar on the website as soon as you add it.</p>') +
          '<label class="field"><span>Event name</span><input name="title" maxlength="120" autocapitalize="words" value="' + esc(ev ? ev.title : '') + '" /></label>' +
          '<label class="field"><span>Date</span><input name="date" type="date" value="' + esc(ev ? eventDay(ev) : '') + '"' + (ev ? '' : ' min="' + today + '"') + ' />' +
            (ev && !eventDay(ev) ? '<small>This event has no year. Pick the date so it shows correctly.</small>' : '') + '</label>' +
          '<div id="timePart">' + timePartHtml(times) + '</div>' +
          '<label class="field"><span>Where</span><input name="venue" maxlength="80" autocapitalize="words" value="' + esc(ev ? str(ev.venue) : DEFAULT_VENUE) + '" /></label>' +
          '<div class="chips">' + venues.slice(0, 5).map(function (v) { return '<button type="button" class="seg" data-action="venue" data-venue="' + esc(v) + '">' + esc(v) + '</button>'; }).join('') + '</div>' +
          '<div class="field"><span>Type of event</span><div class="chips" style="margin:0" id="typeChips">' + typeChipsHtml() + '</div></div>' +
          '<div class="switch-row" data-action="special" role="switch" aria-checked="' + eventDraft.special + '" id="specialRow"><div class="grow"><div>Show it as Special</div><div class="note">Guests see a Special label on it instead of the type.</div></div><div class="switch' + (eventDraft.special ? ' on' : '') + '"></div></div>' +
          '<label class="field"><span>Description</span><textarea name="desc" maxlength="600" rows="3" placeholder="Tell guests about the evening.">' + esc(ev ? str(ev.desc) : '') + '</textarea></label>' +
          '<hr /><div class="field"><span>Photo</span><div id="photoPart">' + photoPartHtml() + '</div></div>' +
          '<p class="error" id="formError" hidden></p>' +
          '<button class="btn primary block" id="formSave">' + (ev ? 'Save changes' : 'Add to the calendar') + '</button>' +
          (ev ? '<button type="button" class="btn block danger" style="margin-top:10px" data-action="deleteEvent" data-id="' + esc(ev.id) + '" data-leave="1">Delete event</button>' : '') +
        '</form></main>';
    }

    function timePartHtml(times) {
      if (!times) {
        return '<label class="field"><span>Time</span><input name="freeTime" maxlength="60" value="' + esc(eventDraft.freeTime) + '" /><small>Written in the admin panel, for example 7:00 PM – 10:00 PM.</small></label>' +
          '<button type="button" class="btn text" style="margin:-8px 0 8px" data-action="usePickers">Use the time pickers instead</button>';
      }
      return '<div class="pair"><label class="field"><span>Starts</span><input name="starts" type="time" value="' + times[0] + '" /></label>' +
        '<label class="field"><span>Ends</span><input name="ends" type="time" value="' + times[1] + '"' + (times[1] ? '' : ' disabled') + ' /></label></div>' +
        '<label class="switch-row" style="padding-top:0"><input type="checkbox" name="noEnd"' + (times[1] ? '' : ' checked') + ' style="width:22px;height:22px;margin:0" /><span>No end time</span></label>';
    }

    function typeChipsHtml() {
      return EVENT_TYPES.map(function (t) {
        return '<button type="button" class="seg' + (eventDraft.category === t.id ? ' on' : '') + '" data-action="eventType" data-type="' + t.id + '">' + t.label + '</button>';
      }).join('');
    }

    function photoPartHtml() {
      var d = eventDraft;
      var main;
      if (d.preparing) main = '<div class="photo-empty">Getting the photo ready…</div>';
      else if (d.picked) main = '<img class="photo-main" alt="" src="' + d.picked.url + '" />';
      else if (d.photoSrc) main = '<img class="photo-main" alt="" data-photo="' + esc(d.photoSrc) + '" />';
      else main = '<div class="photo-empty">No photo</div>';
      return main +
        '<div class="actions"><label class="btn">' + '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">' + ICONS.plus + '</svg>Choose from phone' +
          '<input type="file" accept="image/*" id="photoFile" hidden /></label>' +
          (d.picked || d.photoSrc ? '<button type="button" class="btn text" data-action="noPhoto">No photo</button>' : '') + '</div>' +
        '<p class="muted" style="margin-top:12px">Or use one of Belle\'s photos:</p>' +
        '<div class="builtins">' + BUILT_IN.map(function (p) {
          return '<button type="button" class="' + (!d.picked && d.photoSrc === p.src ? 'on' : '') + '" data-action="builtIn" data-src="' + p.src + '" aria-label="' + esc(p.label) + '"><img alt="" src="../' + p.src + '" loading="lazy" /></button>';
        }).join('') + '</div>' +
        '<p class="note">A wide photo looks best. The website shows it large at the top when it is the next event.</p>';
    }

    function redrawPhotoPart() {
      var el = document.getElementById('photoPart');
      if (el) {
        el.innerHTML = photoPartHtml();
        fillPhotos();
      }
    }

    function saveEventForm(form) {
      var d = eventDraft;
      var v = function (name) { return form.elements[name] ? form.elements[name].value.trim() : ''; };
      var date = v('date');
      var free = form.elements.freeTime ? v('freeTime') : null;
      var problem = !v('title') ? 'Give the event a name.'
        : !parseDay(date) && (!d.existing || eventDay(d.existing)) ? 'Pick the date of the event.'
        : !d.existing && date < colomboDay(0) ? 'That date has passed. Pick today or a later date.'
        : free !== null && !free ? 'Say when it starts, or use the time pickers.'
        : d.preparing ? 'The photo is still getting ready. Try again in a moment.' : '';
      var error = document.getElementById('formError');
      error.hidden = !problem;
      error.textContent = problem;
      if (problem) return;
      // Starting from the saved entry keeps anything the admin panel added that this form does not show
      var entry = d.existing ? JSON.parse(JSON.stringify(d.existing)) : { id: 'event-' + Date.now(), hasImage: false, imageKey: '', imageData: '' };
      var type = EVENT_TYPES.find(function (t) { return t.id === d.category; }) || EVENT_TYPES[0];
      var ends = form.elements.noEnd && form.elements.noEnd.checked ? '' : v('ends');
      entry.title = v('title');
      entry.category = type.id;
      entry.categoryLabel = type.badge;
      entry.time = free !== null ? free : eventTimeText(v('starts') || '19:00', ends);
      entry.venue = v('venue');
      entry.desc = v('desc');
      entry.isVip = d.special;
      var day = parseDay(date);
      if (day) {
        entry.dateStr = date;
        entry.day = day.getUTCDate();
        entry.month = MONTHS[day.getUTCMonth()];
        entry.dow = WEEKDAYS[day.getUTCDay()];
      }
      var button = document.getElementById('formSave');
      button.disabled = true;
      button.textContent = d.picked ? 'Uploading the photo…' : 'Saving…';
      var uploaded = null;
      var picked = d.picked;
      var keep = d.photoSrc;
      function setPhoto(src, key) {
        // Framing set in the admin panel was for the old photo
        if (!d.existing || src !== d.existing.imageData) delete entry.mediaFrame;
        entry.imageData = src;
        entry.imageKey = src ? key : '';
        entry.hasImage = !!src;
      }
      (picked ? uploadPhoto(picked).then(function (address) {
        uploaded = address;
        setPhoto(address, '');
      }) : Promise.resolve().then(function () {
        var builtIn = BUILT_IN.find(function (p) { return p.src === keep; });
        setPhoto(keep, builtIn ? builtIn.key : d.existing && keep === d.existing.imageData ? str(d.existing.imageKey) : '');
      })).then(function () {
        return saveEvent(entry);
      }).then(function () {
        toast(d.existing ? 'Saved. The website shows the change now.' : 'Added to the Event Calendar.');
        back('events');
      }, function (err) {
        if (err && err.saved) {
          toast(err.text);
          back('events');
          return;
        }
        if (uploaded) forgetPhoto(uploaded);
        error.hidden = false;
        error.textContent = errorText(err);
        button.disabled = false;
        button.textContent = d.existing ? 'Save changes' : 'Add to the calendar';
      });
    }

    function askDeleteEvent(id, leave) {
      var ev = events.find(function (e) { return e.id === id; });
      confirmBox('Delete ' + ((ev && ev.title) || 'this event') + '?', 'It comes off the Event Calendar on the website straight away.', 'Delete', true).then(function (yes) {
        if (!yes) return;
        if (leave) back('events');
        deleteEvent(id).then(function (removed) {
          if (!removed) return toast('That event was already deleted.');
          toast('Deleted from the website.', 'Undo', function () {
            saveEvent(removed).then(function () { toast('Put back on the calendar.'); }, function (err) { toast(errorText(err)); });
          });
        }, function (err) { toast(errorText(err)); });
      });
    }

    /* ---------- Menu, dialogs and short messages ---------- */
    function openMenu() {
      var state = alertsState();
      var alertItem = '';
      if (state === 'on') alertItem = '<button class="item" data-action="alertsOff">Alerts on this phone<span class="chip good">On</span></button><button class="item" data-action="testAlert">Send a test alert</button>';
      else if (state === 'off') alertItem = '<button class="item" data-action="alertsOn">Alerts on this phone<span class="chip">Off</span></button>';
      layer.innerHTML = '<div class="scrim" data-action="closeLayer"><div class="sheet" role="dialog" aria-label="Menu">' +
        '<div class="who"><div>' + esc(session.email) + '</div><div class="note">' + esc(LABELS[session.role] || session.role) + '</div></div>' +
        alertItem +
        '<button class="item" data-action="open" data-url="' + CALENDAR_URL + '">See the calendar on the website</button>' +
        '<button class="item" data-action="open" data-url="' + ADMIN_URL + '">Open the full admin panel</button>' +
        '<button class="item danger" data-action="signOut">Sign out</button>' +
        '<div class="foot">Version ' + VERSION + '</div>' +
      '</div></div>';
    }

    function closeLayer() { layer.innerHTML = ''; }

    function confirmBox(title, text, okLabel, danger) {
      return new Promise(function (resolve) {
        layer.innerHTML = '<div class="scrim dialog-wrap"><div class="dialog" role="alertdialog"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
          '<div class="actions"><button class="btn text" data-answer="no">' + (danger ? 'Keep it' : 'Cancel') + '</button>' +
          '<button class="btn text' + (danger ? ' danger' : '') + '" data-answer="yes">' + esc(okLabel) + '</button></div></div></div>';
        layer.querySelectorAll('[data-answer]').forEach(function (b) {
          b.addEventListener('click', function (e) {
            e.stopPropagation();
            closeLayer();
            resolve(b.getAttribute('data-answer') === 'yes');
          });
        });
      });
    }

    var toastTimer = null;
    function toast(text, actionLabel, onAction) {
      var el = document.getElementById('toast');
      clearTimeout(toastTimer);
      el.innerHTML = '<div class="grow">' + esc(text) + '</div>' + (actionLabel ? '<button>' + esc(actionLabel) + '</button>' : '');
      el.hidden = false;
      if (actionLabel) {
        el.querySelector('button').addEventListener('click', function () {
          el.hidden = true;
          onAction();
        });
      }
      toastTimer = setTimeout(function () { el.hidden = true; }, actionLabel ? 7000 : 4000);
    }

    function askStatus(b, status) {
      if (status !== 'declined' && status !== 'cancelled') return setStatus(b, status);
      var decline = status === 'declined';
      confirmBox(decline ? 'Decline this request?' : 'Cancel this reservation?', 'The guest is not told until you send them the message.', decline ? 'Decline' : 'Cancel it', true).then(function (yes) {
        if (yes) setStatus(b, status);
      });
    }

    /* ========================================================
       TAPS AND TYPING
       ======================================================== */
    var actions = {
      back: function () {
        var r = route();
        back(r.name === 'booking-edit' ? 'booking/' + encodeURIComponent(r.id) : r.name === 'event' || r.name === 'event-new' ? 'events' : '');
      },
      go: function (el) { go(el.getAttribute('data-to')); },
      tab: function (el) {
        depth = 0;
        var to = el.getAttribute('data-tab');
        history.replaceState(null, '', location.pathname + location.search + (to ? '#' + to : ''));
        if (to === 'events') refreshEvents().catch(function () {});
        render();
      },
      list: function (el) {
        view.list = el.getAttribute('data-list');
        render();
      },
      status: function (el) {
        var b = findBooking(el.getAttribute('data-id'));
        if (b) askStatus(b, el.getAttribute('data-status'));
      },
      tell: function (el) { var b = findBooking(el.getAttribute('data-id')); if (b) tellGuest(b); },
      told: function (el) { var b = findBooking(el.getAttribute('data-id')); if (b) markTold(b); },
      menu: openMenu,
      closeLayer: function (el, e) { if (e.target === el) closeLayer(); },
      alertsOn: function () { closeLayer(); alertsOn(); },
      alertsOff: function () { closeLayer(); alertsOff(); },
      testAlert: function () { closeLayer(); testAlert(); },
      open: function (el) { closeLayer(); window.open(el.getAttribute('data-url'), '_blank', 'noopener'); },
      signOut: function () {
        closeLayer();
        confirmBox('Sign out?', 'This phone stops getting reservation alerts until someone signs in again.', 'Sign out', false).then(function (yes) {
          if (yes) endSession('');
        });
      },
      showPass: function (el) {
        var input = document.getElementById('siPassword');
        input.type = input.type === 'password' ? 'text' : 'password';
        el.textContent = input.type === 'password' ? 'Show' : 'Hide';
      },
      forgot: function () {
        var email = document.getElementById('siEmail').value.trim();
        var error = document.getElementById('siError');
        if (!email) {
          error.hidden = false;
          error.textContent = 'Type your email first, then tap Forgot your password.';
          return;
        }
        authCall(AUTH_URL + 'sendOobCode?key=' + API_KEY, { requestType: 'PASSWORD_RESET', email: email }).catch(function (err) {
          if (!err || err.authCode !== 'EMAIL_NOT_FOUND') throw err;
        }).then(function () {
          toast('If that email has an account, a reset link is on its way.');
        }, function (err) { toast(signInMessage(err)); });
      },
      deleteEvent: function (el, e) {
        e.stopPropagation();
        askDeleteEvent(el.getAttribute('data-id'), el.getAttribute('data-leave') === '1');
      },
      venue: function (el) { document.querySelector('#eventForm [name=venue]').value = el.getAttribute('data-venue'); },
      eventType: function (el) {
        eventDraft.category = el.getAttribute('data-type');
        document.getElementById('typeChips').innerHTML = typeChipsHtml();
      },
      special: function (el) {
        eventDraft.special = !eventDraft.special;
        el.setAttribute('aria-checked', eventDraft.special);
        el.querySelector('.switch').classList.toggle('on', eventDraft.special);
      },
      usePickers: function () {
        eventDraft.freeTime = null;
        document.getElementById('timePart').innerHTML = timePartHtml(['19:00', '22:00']);
      },
      noPhoto: function () {
        eventDraft.picked = null;
        eventDraft.photoSrc = '';
        redrawPhotoPart();
      },
      builtIn: function (el) {
        eventDraft.picked = null;
        eventDraft.photoSrc = el.getAttribute('data-src');
        redrawPhotoPart();
      },
      alertsBanner: function () { alertsOn(); }
    };

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-action]');
      if (!el || !actions[el.getAttribute('data-action')]) return;
      if (el.tagName === 'A') return;
      // A button inside a card does its own thing, not the card's
      if (el.getAttribute('data-action') === 'go' && e.target.closest('button') && e.target.closest('button') !== el) return;
      e.preventDefault();
      actions[el.getAttribute('data-action')](el, e);
    });

    document.addEventListener('submit', function (e) {
      e.preventDefault();
      var form = e.target;
      if (form.id === 'signInForm') {
        var button = document.getElementById('siButton');
        var error = document.getElementById('siError');
        button.disabled = true;
        button.textContent = 'Signing in…';
        signIn(document.getElementById('siEmail').value.trim(), document.getElementById('siPassword').value).then(function () {
          signInNote = '';
          start();
        }, function (err) {
          error.hidden = false;
          error.textContent = err.text;
          button.disabled = false;
          button.textContent = 'Sign in';
        });
      } else if (form.id === 'bookingForm') {
        saveBooking(form);
      } else if (form.id === 'eventForm') {
        saveEventForm(form);
      }
    });

    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'photoFile' && t.files && t.files[0]) {
        eventDraft.preparing = true;
        redrawPhotoPart();
        preparePhoto(t.files[0]).then(function (photo) {
          eventDraft.picked = photo;
        }, function (err) {
          toast((err && err.text) || 'That photo could not be opened. Try another one.');
        }).then(function () {
          eventDraft.preparing = false;
          redrawPhotoPart();
        });
      } else if (t.name === 'noEnd') {
        var ends = document.querySelector('#eventForm [name=ends]');
        ends.disabled = t.checked;
        if (!t.checked && !ends.value) {
          var starts = document.querySelector('#eventForm [name=starts]').value || '19:00';
          ends.value = ((+starts.slice(0, 2) + 3) % 24 + '').padStart(2, '0') + starts.slice(2);
        }
      }
    });

    window.addEventListener('hashchange', function () {
      closeLayer();
      render();
    });

    // A tap on an alert while the app is open
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'open' && e.data.url) {
          var hash = new URL(e.data.url).hash;
          if (hash && hash !== location.hash) go(hash.slice(1));
        }
      });
    }

    // iPhones pause the app in the background, so coming back checks the live line and the alerts
    document.addEventListener('visibilitychange', function () {
      if (document.hidden || !session) return;
      if (!stream || Date.now() - lastHeard > 100000) startStream(true);
      if (route().name === 'events') refreshEvents().catch(function () {});
      checkAlerts();
      dataChanged();
    });

    function start() {
      if (!session) return render();
      startStream(false);
      render();
      if (route().name === 'events') refreshEvents().catch(function () {});
      checkAlerts();
      // The role may have changed since this phone last signed in
      getIdToken().then(function (token) { return checkAccess(session.uid, token); }).then(function (role) {
        if (!session) return;
        if (!seesBookings(role)) return endSession('Your access to reservations has been removed. Ask the main admin if you need it.');
        if (role !== session.role) {
          session.role = role;
          saveSession();
          drawn = '';
          render();
        }
      }, function () {});
    }

    loadSession();
    if ('serviceWorker' in navigator) readyWorker().catch(function () {});
    start();
  })();
  </script>
</body>
</html>
