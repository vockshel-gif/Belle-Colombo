            '<input type="text" id="dishName" data-dish="name" value="' + esc(item.name) + '" placeholder="The Classic Burger" /></div>' +

          '<div id="pricePart">' + pricePartHtml(item) + '</div>' +
        '</section>' +
        '<section class="card card-pad">' +
          '<h2 class="card-title">Choices</h2>' +
          '<p class="card-hint">Use this when guests pick one option, like a filling or style. Leave empty if there are none.</p>' +
          '<div id="optionsPart">' + optionsPartHtml(item) + '</div>' +
        '</section>' +
        '<section class="card card-pad">' +
          '<h2 class="card-title">Add-ons and sides</h2>' +
          '<p class="card-hint">Write prices like LKR 250 and they will show in bold.</p>' +
          '<div id="extrasPart">' + extrasPartHtml() + '</div>' +
        '</section>' +

          '<button type="button" class="btn btn-primary" data-action="saveDish">Save dish</button>' +
          '<button type="button" class="btn" data-action="cancelDish">Cancel</button>' +
          '<span class="spacer"></span>' +
          (ed.isNew ? '' : '<button type="button" class="btn btn-danger" data-action="deleteDish">Delete dish</button>') +
        '</div>';
    }

    function setPriceType(type) {
      var found = editorDish();
      var item = found.item;
      var rows = hasCuts(item)
        ? item.cuts.map(function (c) { return { label: c.origin || '', price: c.price || '', premium: !!c.premium }; })
        : [{ label: item.priceLabel || '', price: item.price || '' }, { label: item.price2Label || '', price: item.price2 || '' }];
      rows = rows.filter(function (r) { return r.label || r.price; });
      if (type === 'list') {
        item.cuts = (rows.length ? rows : [{ label: '', price: '' }]).map(function (r) {
          var cut = { origin: r.label, price: r.price };
          if (r.premium) cut.premium = true;
          return cut;
        });
        item.price = item.priceLabel = item.price2 = item.price2Label = '';
      } else {
        item.cuts = null;
        item.price = rows[0] ? rows[0].price : '';
        item.priceLabel = type === 'two' && rows[0] ? rows[0].label : '';
        item.price2 = type === 'two' && rows[1] ? rows[1].price : '';
        item.price2Label = type === 'two' && rows[1] ? rows[1].label : '';
      }
      view.editor.priceType = type;
      $('pricePart').innerHTML = pricePartHtml(item);
      touch();
    }

    function setBackgroundType(type) {
      var item = editorDish().item;
      view.editor.background = type;
      if (type === 'none') {
        item.image = '';
        item.video = '';
      } else if (type === 'photo') {
        item.video = '';
      } else {
        item.video = item.video || VIDEO_PRESETS[0].src;
      }
      $('backgroundPart').innerHTML = backgroundPartHtml(item);
      touch();
    }

    function setVegetarian(item, isVeg) {
      if ('isVeg' in item || !isGroupMenu(view.editor.menuId)) item.isVeg = isVeg;
      if (item.tags || isVeg) {
        var tags = (item.tags || []).filter(function (t) { return t !== 'Vegetarian'; });
        if (isVeg) tags.push('Vegetarian');
        item.tags = tags;
      }
    }

    function moveDishToSection(value, selectEl) {
      var ed = view.editor;
      var found = editorDish();
      if (value === '__new') {
        selectEl.innerHTML = sectionOptionsHtml(ed.menuId, found);
        askText('Add a section', 'Name', '', 'For example: Signature Burgers').then(function (name) {
          if (!name) return;
          var current = editorDish();
          if (isGroupMenu(ed.menuId)) {
            var key = slugify(name) || 'section-' + Date.now();
            menuGroups(ed.menuId).push({ key: key, title: name.toUpperCase(), category: name, items: [] });
            if (ed.menuId === 'alacarte') sectionNames(ed.menuId).push(name);
            moveDishToSection(key);
          } else {
            sectionNames(ed.menuId).push(name);
            syncCustomSections(ed.menuId);
            current.item.subCategory = name;
          }
          $('dishSection').innerHTML = sectionOptionsHtml(ed.menuId, editorDish());
          touch();
        });
        return;
      }
      if (isGroupMenu(ed.menuId)) {
        var target = menuGroups(ed.menuId).find(function (g) { return g.key === value; });
        if (target && target !== found.group) {
          found.list.splice(found.index, 1);
          target.items.push(found.item);
          found.item.subCategory = target.category || '';
        }
      } else {
        found.item.subCategory = value;
      }
    }

    function onDishInput(t) {
      var found = editorDish();
      if (!found) return;
      var item = found.item;
      var d = t.dataset;
      var i = parseInt(d.i, 10);

      if (t.name === 'priceType') return setPriceType(t.value);
      if (t.name === 'bgType') return setBackgroundType(t.value);
      if (t.id === 'dishSection') moveDishToSection(t.value, t);
      else if (t.id === 'dishVeg') setVegetarian(item, t.checked);
      else if (t.id === 'dishVideo') item.video = t.value;
      else if (d.dish) item[d.dish] = t.value;
      else if (d.cut === 'premium') {
        if (t.checked) item.cuts[i].premium = true;
        else delete item.cuts[i].premium;
      } else if (d.cut) item.cuts[i][d.cut] = t.value;
      else if (d.opt === 'isVeg') {
        if (t.checked) item.options[i].isVeg = true;
        else delete item.options[i].isVeg;
      } else if (d.opt) item.options[i][d.opt] = t.value;
      else if (d.extra) {
        view.editor.extras[i][d.extra] = t.value;
        writeExtras(item, view.editor.extras);
      }
      touch();
    }

    function saveDish() {
      var found = editorDish();
      if (!found) return go('menu', view.menuId);
      if (!String(found.item.name || '').trim()) {
        toast('Please give the dish a name first.');
        $('dishName').focus();
        return;
      }
      if (view.editor.priceType === 'list') {
        found.item.cuts = found.item.cuts.filter(function (c) { return c.origin || c.price; });
      }
      found.item.name = found.item.name.trim();
      var name = found.item.name;
      go('menu', view.menuId);
      toast(name + ' saved. Press Publish when you are ready.');
    }

    function cancelDish() {
      var ed = view.editor;
      var found = editorDish();
      if (found) {
        found.list.splice(found.index, 1);
        if (!ed.isNew) ed.originList.splice(ed.originIndex, 0, ed.snapshot);
      }
      view.editor = null;
      go('menu', ed.menuId);
    }

    function deleteDish() {
      var ed = view.editor;
      var found = editorDish();
      askConfirm('Delete ' + (ed.snapshot.name || 'this dish') + '?', 'It will be removed from the menu when you next publish.', 'Delete dish', true).then(function (yes) {
        if (!yes) return;
        found.list.splice(found.index, 1);
        view.editor = null;
        touch();
        go('menu', ed.menuId);
      });
    }

    /* ========================================================
       PHOTO UPLOADS
       ======================================================== */
    function shrinkImage(file, maxSize, done, fail) {
      var reader = new FileReader();
      reader.onerror = fail;
      reader.onload = function (e) {
        var img = new Image();
        img.onerror = fail;
        img.onload = function () {
          var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          var url = canvas.toDataURL('image/webp', 0.72);
          if (url.indexOf('data:image/webp') !== 0) url = canvas.toDataURL('image/jpeg', 0.72);
          done(url);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function hasRoomFor(url, replacing) {
      if (dataSize() - (replacing || 0) + url.length <= DATA_SIZE_MAX_BYTES) return true;
      openDialog({
        title: 'There is no room for this photo',
        text: 'Photos are stored with your menu, and every new visitor downloads all of them. Your menu has reached the 2 MB limit that keeps your website fast and inside the free Firebase allowance. Delete a photo you no longer need, then try again.'
      });
      return false;
    }

    function onUpload(t) {
      var file = t.files[0];
      if (!file) return;
      var mode = t.dataset.upload;
      var target = t.dataset.i;
      shrinkImage(file, mode === 'event' ? EVENT_PHOTO_MAX_PX : DISH_PHOTO_MAX_PX, function (url) {
        var media = mode === 'replace' ? view.mediaList[parseInt(target, 10)] : null;
        if (!hasRoomFor(url, media ? media.src.length : 0)) return;
        if (mode === 'dish') {
          var found = editorDish();
          if (!found) return;
          found.item.image = url;
          found.item.video = '';
          $('backgroundPart').innerHTML = backgroundPartHtml(found.item);
        } else if (mode === 'event') {
          var ev = editorEvent();
          if (!ev) return;
          ev.imageData = url;
          ev.imageKey = '';
          ev.hasImage = true;
          $('eventPhotos').innerHTML = photoGridHtml(ev.imageData, EVENT_PHOTOS);
        } else if (mode === 'replace') {
          replaceMedia(media, url);
          return;
        } else {
          chooseUploadTarget(url);
          return;
        }
        touch();
        toast('Photo added.');
      }, function () {
        toast('That file could not be read as a photo. Try a JPG or PNG.');
      });
    }

    function pickPhoto(el) {
      var src = el.getAttribute('data-src');
      if (view.page === 'dish') {
        var item = editorDish().item;
        item.image = src;
        item.video = '';
        $('backgroundPart').innerHTML = backgroundPartHtml(item);
      } else {
        var ev = editorEvent();
        var preset = EVENT_PHOTOS.find(function (p) { return p.src === src; });
        ev.imageData = src;
        ev.imageKey = preset ? preset.key : '';
        ev.hasImage = true;
        $('eventPhotos').innerHTML = photoGridHtml(ev.imageData, EVENT_PHOTOS);
      }
      touch();
    }

    /* ========================================================
       PHOTOS AND VIDEOS PAGE
       ======================================================== */
    function collectMedia() {
      var bySrc = {};
      var list = [];
      function entry(src, kind) {
        if (!bySrc[src]) {
          bySrc[src] = { src: src, kind: kind, isUpload: src.indexOf('data:') === 0, uses: [] };
          list.push(bySrc[src]);
        }
        return bySrc[src];
      }
      allDishes().forEach(function (d) {
        var use = { type: 'dish', menuId: d.menuId, id: d.item.id, label: d.item.name, area: d.area };
        if (d.item.image) entry(d.item.image, 'photo').uses.push(Object.assign({ field: 'image' }, use));
        if (d.item.video) entry(d.item.video, 'video').uses.push(Object.assign({ field: 'video' }, use));
      });
      appData.events.forEach(function (ev) {
        if (ev.imageData) entry(ev.imageData, 'photo').uses.push({ type: 'event', id: ev.id, label: ev.title, area: 'Events' });
      });
      (appData.standaloneMedia || []).forEach(function (m) {
        if (m && m.url) entry(m.url, m.type === 'video' ? 'video' : 'photo');
      });
      return list;
    }

    function formatSize(bytes) {
      return bytes < 1024 * 1024 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function coveredVisitors(size) {
      var visitors = FREE_DOWNLOAD_BYTES / (size + VISIT_OVERHEAD_BYTES);
      var step = visitors >= 100000 ? 10000 : (visitors >= 10000 ? 1000 : 100);
      return (Math.floor(visitors / step) * step).toLocaleString('en-US');
    }

    function dataUseHtml() {
      var size = dataSize();
      var pct = Math.min(100, Math.round((size / DATA_SIZE_MAX_BYTES) * 100));
      return '<section class="card card-pad">' +
        '<h2 class="card-title">How much guests download</h2>' +
        '<p class="card-hint" style="margin-top:0">Every new visitor downloads ' + formatSize(size) + ' of menu data, including your uploads. Firebase\'s free 10 GB a month covers about <b>' + coveredVisitors(size) + ' new visitors</b>. People coming back use almost nothing, because their browser keeps a copy until you publish again.</p>' +
        '<div class="meter' + (size > DATA_SIZE_LIMIT_BYTES ? ' is-high' : '') + '" role="img" aria-label="' + pct + ' percent of the 2 MB limit"><span style="width:' + Math.max(pct, 1) + '%"></span></div>' +
        '<p class="field-hint">' + formatSize(size) + ' of the 2 MB limit. Uploads stop at the limit to protect your free allowance.</p>' +
      '</section>';
    }

    function mediaCardHtml(media, index) {
      var preview = media.kind === 'video'
        ? '<video src="' + esc(media.src) + '" muted playsinline preload="metadata" controls></video>'
        : '<img src="' + esc(media.src) + '" alt="" loading="lazy" />';
      var shown = media.uses.slice(0, 3).map(function (use) {
        var action = use.type === 'dish'
          ? 'data-action="openDish" data-menu="' + esc(use.menuId) + '" data-id="' + esc(use.id) + '"'
          : 'data-action="openEvent" data-id="' + esc(use.id) + '"';
        return '<button type="button" class="btn-link" ' + action + '>' + esc(use.label || 'Unnamed') + '</button> <span>(' + esc(use.area) + ')</span>';
      }).join('<br />');
      var more = media.uses.length > 3 ? '<br /><span>and ' + (media.uses.length - 3) + ' more</span>' : '';
      var uses = media.uses.length
        ? '<div class="media-uses">' + shown + more + '</div>'
        : '<div><span class="chip chip-warn">Not used anywhere</span></div>';
      var word = media.kind === 'video' ? 'video' : 'photo';
      var actions;
      if (media.isUpload) {
        actions = (media.kind === 'photo'
          ? '<label class="btn btn-sm">Replace<input type="file" accept="image/*" data-upload="replace" data-i="' + index + '" hidden /></label>'
          : '') +
          '<button type="button" class="btn btn-sm btn-danger" data-action="deleteMedia" data-i="' + index + '">Delete</button>';
      } else {
        actions = media.uses.length
          ? '<button type="button" class="btn btn-sm" data-action="deleteMedia" data-i="' + index + '">Remove from ' + (media.uses.length === 1 ? 'this item' : 'all ' + media.uses.length + ' items') + '</button>'
          : '';
      }
      return '<article class="media-card" data-media="' + word + '">' +
        '<div class="media-preview">' + preview + '</div>' +
        '<div class="media-info">' +
          (media.isUpload ? '<div><span class="chip">' + formatSize(media.src.length) + '</span></div>' : '') +
          uses +
          '<div class="media-actions">' + actions + '</div>' +
        '</div>' +
      '</article>';
    }

    function mediaHtml() {
      var list = collectMedia();
      view.mediaList = list;
      var cards = function (keepUploads) {
        return list.map(function (media, i) {
          return media.isUpload === keepUploads ? mediaCardHtml(media, i) : '';
        }).join('');
      };
      var uploads = cards(true);
      var builtIn = cards(false);
      return pageHead('Photos & Videos', 'See every photo and video on your website, and where it is used.',
        '<label class="btn btn-primary">' + icon('plus', 16) + 'Upload a photo<input type="file" accept="image/*" data-upload="media" hidden /></label>') +
        dataUseHtml() +
        '<div class="media-heading"><h2>Your uploads</h2><p>Stored with your menu, so these use your free Firebase allowance. Deleting one removes it from every dish and event using it.</p></div>' +
        (uploads ? '<div class="media-grid">' + uploads + '</div>' : '<div class="card"><p class="empty">You have not uploaded any photos yet.</p></div>') +
        '<div class="media-heading"><h2>Built into your website</h2><p>These files are part of the website, so they use none of your Firebase allowance. You can take one off a dish here, but the file itself stays.</p></div>' +
        (builtIn ? '<div class="media-grid">' + builtIn + '</div>' : '<div class="card"><p class="empty">None in use.</p></div>');
    }

    function refreshAfterMediaChange() {
      touch();
      renderSide();
      keepScroll(renderPage);
    }

    function deleteMedia(el) {
      var media = view.mediaList[parseInt(el.getAttribute('data-i'), 10)];
      var word = media.kind === 'video' ? 'video' : 'photo';
      var names = media.uses.map(function (use) { return use.label || 'Unnamed'; });
      var where = names.length
        ? ' It will come off ' + names.slice(0, 3).join(', ') + (names.length > 3 ? ' and ' + (names.length - 3) + ' more' : '') + '.'
        : '';
      var title = media.isUpload ? 'Delete this ' + word + '?' : 'Remove this ' + word + '?';
      askConfirm(title, 'Guests keep seeing it until you press Publish.' + where, media.isUpload ? 'Delete ' + word : 'Remove ' + word, true).then(function (yes) {
        if (!yes) return;
        media.uses.forEach(function (use) {
          if (use.type === 'dish') {
            var found = findDish(use.menuId, use.id);
            if (found) found.item[use.field] = '';
          } else {
            var ev = appData.events.find(function (x) { return x.id === use.id; });
            if (ev) {
              ev.imageData = '';
              ev.imageKey = '';
              ev.hasImage = false;
            }
          }
        });
        if (appData.standaloneMedia) {
          appData.standaloneMedia = appData.standaloneMedia.filter(function (m) { return !m || m.url !== media.src; });
        }
        refreshAfterMediaChange();
        toast(media.isUpload ? 'Deleted. Press Publish to remove it from the live site.' : 'Removed. Press Publish to update the live site.');
      });
    }

    function replaceMedia(media, url) {
      media.uses.forEach(function (use) {
        if (use.type === 'dish') {
          var found = findDish(use.menuId, use.id);
          if (found) found.item.image = url;
        } else {
          var ev = appData.events.find(function (x) { return x.id === use.id; });
          if (ev) {
            ev.imageData = url;
            ev.imageKey = '';
          }
        }
      });
      (appData.standaloneMedia || []).forEach(function (m) {
        if (m && m.url === media.src) m.url = url;
      });
      refreshAfterMediaChange();
      toast('Photo replaced.');
    }

    // Every upload belongs to something, so no unused photo costs guests a download
    function chooseUploadTarget(url) {
      var targets = allDishes().map(function (d) {
        return { group: d.area, label: d.item.name || 'Unnamed', dish: d };
      }).concat(appData.events.map(function (ev) {
        return { group: 'Events', label: ev.title || 'Unnamed', event: ev };
      }));
      var groups = {};
      targets.forEach(function (target, i) {
        (groups[target.group] = groups[target.group] || []).push('<option value="' + i + '">' + esc(target.label) + '</option>');
      });
      var options = Object.keys(groups).map(function (name) {
        return '<optgroup label="' + esc(name) + '">' + groups[name].join('') + '</optgroup>';
      }).join('');
      openDialog({
        title: 'Where should this photo go?',
        text: 'Choose the dish or event to show it on. You can use it on others from their own photo section.',
        html: '<img class="upload-preview" src="' + esc(url) + '" alt="The photo you chose" />' +
          '<div class="field"><label for="uploadTarget">Show it on</label><select id="uploadTarget" data-dlg-input>' + options + '</select></div>',
        actions: [
          { id: 'no', label: 'Cancel' },
          { id: 'yes', label: 'Use this photo', style: 'primary' }
        ]
      }).then(function (r) {
        if (r.action !== 'yes') return;
        var target = targets[parseInt(r.value, 10)];
        if (target.dish) {
          target.dish.item.image = url;
          target.dish.item.video = '';
        } else {
          target.event.imageData = url;
          target.event.imageKey = '';
          target.event.hasImage = true;
        }
        refreshAfterMediaChange();
        toast('Photo added to ' + target.label + '.');
      });
    }

    /* ========================================================
       TASTING MENUS PAGE
       ======================================================== */
    function tastingField(label, attrs, value, placeholder) {
      return '<div class="field"><label>' + esc(label) + '<input type="text" style="margin-top:5px" ' + attrs + ' value="' + esc(value) + '" placeholder="' + esc(placeholder || '') + '" /></label></div>';
    }

    function tastingDishHtml(dish, c, d) {
      var attrs = 'data-c="' + c + '" data-d="' + d + '"';
      return '<div class="course-dish" data-sort-item="' + c + ':' + d + '">' +
        '<div class="card-drag-row">' + dragHandleHtml(dish.name || 'this dish') + '<span>Dish ' + (d + 1) + '</span></div>' +
        '<div class="field-row">' +
          tastingField('Dish name', 'data-dfield="name" ' + attrs, dish.name, 'Yellowfin Tuna Carpaccio') +

    function setEventDate(ev, dateStr) {
      var parts = dateStr.split('-');
      if (parts.length !== 3) return;
      var date = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      ev.dateStr = dateStr;
      ev.day = date.getDate();
      ev.month = MONTHS[date.getMonth()];
      ev.dow = WEEKDAYS[date.getDay()];
    }

    function onEventInput(t) {
      var ev = editorEvent();
      if (!ev) return;
      if (t.dataset.ev) ev[t.dataset.ev] = t.value;
      else if (t.id === 'eventDate') setEventDate(ev, t.value);
      else if (t.id === 'eventVip') ev.isVip = t.checked;
      else if (t.id === 'eventType') {
        var type = EVENT_TYPES.find(function (x) { return x.id === t.value; });
        ev.category = type.id;
        ev.categoryLabel = type.badge;
      }
      touch();
    }

    function sortEvents() {
      function rank(ev) {
        var date = eventDate(ev);
        return date ? date.getTime() : Infinity;
      }
      appData.events.sort(function (a, b) {
        return rank(a) === rank(b) ? 0 : (rank(a) < rank(b) ? -1 : 1);
      });
    }

    function saveEvent() {
      var ev = editorEvent();
      if (!ev) return go('events');
      if (!String(ev.title || '').trim()) {
        toast('Please give the event a name first.');
        $('eventTitle').focus();
        return;
      }
      if (view.editor.isNew && !ev.dateStr) {
        toast('Please pick a date for the event.');
        $('eventDate').focus();
        return;
      }
      ev.title = ev.title.trim();
      var title = ev.title;
      sortEvents();
      go('events');
      toast(title + ' saved. Press Publish when you are ready.');
    }

    function cancelEvent() {
      var ed = view.editor;
      var idx = appData.events.findIndex(function (ev) { return ev.id === ed.id; });
      if (idx !== -1) {
        appData.events.splice(idx, 1);
        if (!ed.isNew) appData.events.splice(ed.originIndex, 0, ed.snapshot);
      }
      view.editor = null;
      go('events');
    }

    function deleteEvent() {
      var ev = editorEvent();
      askConfirm('Delete ' + (ev.title || 'this event') + '?', 'It will be removed from the calendar when you next publish.', 'Delete event', true).then(function (yes) {
        if (!yes) return;
        appData.events = appData.events.filter(function (x) { return x.id !== ev.id; });
        view.editor = null;
        touch();
        go('events');
      });
    }

    function downloadFile(name, text, type) {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var link = document.createElement('a');
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function downloadBackup() {
      commitDraft();
      downloadFile('belle-colombo-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(appData, null, 2), 'application/json');
      toast('Backup downloaded.');
    }

    function downloadDataFile() {
      commitDraft();
      var text = '// Belle Colombo Central Production Data Store\n' +
        '// Automatically synchronized with Executive Admin Studio\n' +
        '(function(root) {\n' +
        '  var data = ' + JSON.stringify(appData, null, 2) + ';\n' +
        "  if (typeof window !== 'undefined') {\n    window.BELLE_DEFAULT_DATA = data;\n  }\n" +
        "  if (typeof module !== 'undefined' && module.exports) {\n    module.exports = data;\n  }\n" +
        "  if (typeof root !== 'undefined') {\n    root.BELLE_DEFAULT_DATA = data;\n  }\n" +
        "})(typeof globalThis !== 'undefined' ? globalThis : this);\n";
      downloadFile('belleData.js', text, 'application/javascript;charset=utf-8');
    }

    function replaceDraft(data, message) {
      view.editor = null;
      appData = normalizeData(stripPublishInfo(data));
      commitDraft();
      view.page = 'home';
      view.menuId = null;
      render();
      showPreviewForPage();
      toast(message);
    }

    function restoreFromFile(file) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var parsed = null;
        try { parsed = JSON.parse(e.target.result); } catch (err) {}
        if (!isMenuData(parsed)) {
          openDialog({ title: 'That is not a backup file', text: 'Please choose a file made with Download a backup.' });
          return;
        }
        askConfirm('Restore this backup?', 'It replaces what you are editing now. The live site does not change until you press Publish.', 'Restore').then(function (yes) {
          if (yes) replaceDraft(parsed, 'Backup restored. Check it, then press Publish.');
        });
      };
      reader.readAsText(file);
    }

    function discardDraft() {
      askConfirm('Discard your changes?', 'Everything goes back to what is on the live site now. This cannot be undone.', 'Discard changes', true).then(function (yes) {
        if (yes) replaceDraft(clone(liveData), 'Changes discarded.');
      });
    }

    function undoPublish() {
      var backup = readJson(LIVE_BACKUP_KEY);
      if (!backup) return;
      askConfirm('Go back to before your last publish?', 'This loads the version from before ' + formatDateTime(backup.savedAt) + '. The live site does not change until you press Publish.', 'Load that version').then(function (yes) {
        if (yes) replaceDraft(backup.data, 'Older version loaded. Check it, then press Publish.');
      });
    }

    /* ========================================================
       SIGN IN (Firebase Authentication)
       This screen is only the front door. The database rules are
       what protect the menu: they accept a publish only when it
       carries a valid token for the admin's own account.
       ======================================================== */
    var AUTH_MESSAGES = {
      INVALID_LOGIN_CREDENTIALS: "That email or password isn't right.",
      EMAIL_NOT_FOUND: "That email or password isn't right.",
      INVALID_PASSWORD: "That email or password isn't right.",
      INVALID_EMAIL: 'Please check the email address.',
      USER_DISABLED: 'This account has been turned off in Firebase.',
      TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many tries. Please wait a few minutes and try again.',
      OPERATION_NOT_ALLOWED: 'Email sign-in is not turned on in Firebase yet.',
      PASSWORD_LOGIN_DISABLED: 'Email sign-in is not turned on in Firebase yet.',
      WEAK_PASSWORD: 'Please choose a stronger password.'
    };

    function authErrorText(err) {
      if (err && err.authCode) return AUTH_MESSAGES[err.authCode] || 'Firebase could not do that (' + err.authCode + ').';
      return 'Could not reach Firebase. Check your internet connection and try again.';
    }

    function readAuthResponse(res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (res.ok) return body;
        var err = new Error('Sign-in failed');
        err.authCode = ((body.error && body.error.message) || 'HTTP_' + res.status).split(' ')[0];
        throw err;
      });
    }

    function callAuthApi(action, body) {
      return fetch(AUTH_API_URL + action + '?key=' + FIREBASE_API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(readAuthResponse);
    }

    function setAccountTokens(idToken, refreshToken, expiresIn) {
      account.idToken = idToken;
      account.refreshToken = refreshToken;
      account.expiresAt = Date.now() + parseInt(expiresIn, 10) * 1000;
    }

    // Stays for this tab only, unless "Keep me signed in" was ticked
    function storeAccount() {
      var text = JSON.stringify(account);
      try { sessionStorage.setItem(ACCOUNT_KEY, text); } catch (e) {}
      if (account.remember) writeStore(ACCOUNT_KEY, text);
      else dropStore(ACCOUNT_KEY);
    }

    function loadAccount() {
      var text = null;
      try { text = sessionStorage.getItem(ACCOUNT_KEY); } catch (e) {}
      try { return JSON.parse(text || readStore(ACCOUNT_KEY)); } catch (e) { return null; }
    }

    // Tokens last an hour, so swap for a new one when it is nearly used up
    function getIdToken() {
      if (account.idToken && Date.now() < account.expiresAt - 60000) return Promise.resolve(account.idToken);
      return fetch(TOKEN_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(account.refreshToken)
      }).then(readAuthResponse).then(function (body) {
        setAccountTokens(body.id_token, body.refresh_token, body.expires_in);
        storeAccount();
        return account.idToken;
      });
    }

    function enterApp() {
      $('login').hidden = true;
      $('app').hidden = false;
      if (!booted) {
        booted = true;
        renderLoading();
        startData();
      }
      fitPhone();
    }

    function renderLoading() {
      $('page').innerHTML = '<div class="page"><p class="empty">Loading your menus…</p></div>';
    }

    function showLoginError(message) {
      $('loginNote').hidden = true;
      $('loginError').textContent = message;
      $('loginError').hidden = !message;
    }

    function showLoginNote(message) {
      $('loginError').hidden = true;
      $('loginNote').textContent = message;
      $('loginNote').hidden = !message;
    }

    function signOut(message) {
      if (appData) commitDraft();
      if ($('dialog').open) $('dialog').close();
      account = null;
      try { sessionStorage.removeItem(ACCOUNT_KEY); } catch (e) {}
      dropStore(ACCOUNT_KEY);
      $('app').hidden = true;
      $('login').hidden = false;
      $('loginPass').value = '';
      if (typeof message === 'string') showLoginNote(message);
      else showLoginNote('');
      $('loginPass').focus();
    }

    function bindSignIn() {
      $('loginShow').addEventListener('click', function () {
        var input = $('loginPass');
        var showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        this.textContent = showing ? 'Show' : 'Hide';
      });

      $('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = $('loginEmail').value.trim();
        var button = $('loginSubmit');
        showLoginError('');
        button.disabled = true;
        button.textContent = 'Signing in…';
        callAuthApi('signInWithPassword', { email: email, password: $('loginPass').value, returnSecureToken: true }).then(function (body) {
          account = { email: body.email || email, uid: body.localId, remember: $('loginRemember').checked };
          setAccountTokens(body.idToken, body.refreshToken, body.expiresIn);
          storeAccount();
          $('loginPass').value = '';
          enterApp();
        }, function (err) {
          showLoginError(authErrorText(err));
          $('loginPass').select();
        }).then(function () {
          button.disabled = false;
          button.textContent = 'Sign in';
        });
      });

      $('loginForgot').addEventListener('click', function () {
        var email = $('loginEmail').value.trim();
        if (!email) {
          showLoginError('Type your email above first, then press Forgot your password again.');
          $('loginEmail').focus();
          return;
        }
        function sent() {
          showLoginNote('If that email has an admin account, a reset link is on its way. Check your spam folder too.');
        }
        callAuthApi('sendOobCode', { requestType: 'PASSWORD_RESET', email: email }).then(sent, function (err) {
          if (err.authCode === 'EMAIL_NOT_FOUND') sent();
          else showLoginError(authErrorText(err));
        });
      });
    }

    function startSignIn() {
      OLD_SIGN_IN_KEYS.forEach(dropStore);
      try { sessionStorage.removeItem('belle_admin_auth_session'); } catch (e) {}

      account = loadAccount();
      if (!account) return;
      $('login').hidden = true;
      getIdToken().then(enterApp, function (err) {
        // Offline is fine for editing; a sign-in Firebase has ended is not
        if (err.authCode) signOut('Please sign in again. Your changes are saved on this computer.');
        else enterApp();
      });
    }

    function changePassword(e) {
      e.preventDefault();
      var error = $('passError');
      function fail(message) {
        error.textContent = message;
        error.hidden = false;
      }
      error.hidden = true;
      var fresh = $('passNew').value;
      if (fresh.length < 8) return fail('The new password needs at least 8 characters.');
      if (fresh !== $('passAgain').value) return fail('The two new passwords do not match.');
      // Signing in again proves it's you, and Firebase insists on a recent sign-in for this
      callAuthApi('signInWithPassword', { email: account.email, password: $('passCurrent').value, returnSecureToken: true }).then(function (body) {
        return callAuthApi('update', { idToken: body.idToken, password: fresh, returnSecureToken: true });
      }).then(function (body) {
        setAccountTokens(body.idToken, body.refreshToken, body.expiresIn);
        storeAccount();
        $('passForm').reset();
        toast('Password changed.');
      }, function (err) {
        var wrongCurrent = AUTH_MESSAGES[err.authCode] === AUTH_MESSAGES.INVALID_LOGIN_CREDENTIALS;
        fail(wrongCurrent ? 'The current password is not right.' : authErrorText(err));
      });
    }

    /* ========================================================
       DRAG TO REARRANGE
       Works with mouse and touch through pointer events, and with
       arrow keys on a focused handle. A list is any element with
       data-sort-list; lists sharing data-sort-group can swap items.
       ======================================================== */
    var DRAG_START_DISTANCE = 5;
    var DRAG_EDGE_SIZE = 64;
    var DRAG_EDGE_SPEED = 12;
    var DRAG_MAX_HEIGHT = 96;
    var dragState = null;

    function sortItemsOf(list) {
      return Array.prototype.filter.call(list.children, function (el) {
        return el.hasAttribute('data-sort-item') && !el.classList.contains('is-lifted');
      });
    }

    function sortTailOf(list) {
      return Array.prototype.filter.call(list.children, function (el) {
        return el.hasAttribute('data-sort-tail');
      })[0] || null;
    }

    function readSortLists(group) {
      return Array.prototype.map.call(document.querySelectorAll('[data-sort-group="' + group + '"]'), function (list) {
        return {
          key: list.getAttribute('data-sort-list'),
          items: sortItemsOf(list).map(function (el) { return el.getAttribute('data-sort-item'); })
        };
      });
    }

    function setMenuList(menuId, items) {
      if (menuId === 'lunch') appData.lunchItems = items;
      else getMenu(menuId).items = items;
    }

    function rebuildDishOrder(menuId) {
      var ordered = [];
      getSections(menuId).forEach(function (section) { ordered = ordered.concat(section.items); });
      setMenuList(menuId, ordered);
    }

    function currentTasting() { return appData.tastingMenus[view.tastingKey]; }

    // Each one applies the new on-screen order to the data and returns the moved item's key
    var sortHandlers = {
      menus: function (lists, key) {
        appData.menuCategories = lists[0].items.map(function (id) { return getMenu(id); });
        return key;
      },
      sections: function (lists, key) {
        var menuId = view.menuId;
        if (isGroupMenu(menuId)) {
          var groups = menuGroups(menuId);
          var ordered = lists[0].items.map(function (k) {
            return groups.find(function (g) { return g.key === k; });
          });
          if (menuId === 'alacarte') {
            appData.aLaCarte = ordered;
            appData.subCategories.alacarte = ordered.map(function (g) { return g.category || g.title || g.key; });
          } else {
            appData.theGardenAndBar = ordered;
          }
        } else {
          appData.subCategories[menuId] = lists[0].items;
          syncCustomSections(menuId);
          rebuildDishOrder(menuId);
        }
        return key;
      },
      dishes: function (lists, key) {
        var menuId = view.menuId;
        var byId = {};
        allDishes().forEach(function (d) {
          if (d.menuId === menuId) byId[d.item.id] = d.item;
        });
        if (isGroupMenu(menuId)) {
          menuGroups(menuId).forEach(function (group) {
            var entry = lists.filter(function (l) { return l.key === group.key; })[0];
            var wasHere = group.items.some(function (it) { return it.id === key; });
            group.items = entry.items.map(function (id) { return byId[id]; });
            if (!wasHere && entry.items.indexOf(key) !== -1) byId[key].subCategory = group.category || '';
          });
        } else {
          var ordered = [];
          lists.forEach(function (list) {
            list.items.forEach(function (id) {
              if (id === key) {
                var known = sectionNames(menuId).indexOf(byId[id].subCategory) !== -1;
                if ((known ? byId[id].subCategory : '') !== list.key) byId[id].subCategory = list.key;
              }
              ordered.push(byId[id]);
            });
          });
          setMenuList(menuId, ordered);
        }
        return key;
      },
      courses: function (lists, key) {
        var menu = currentTasting();
        var old = menu.courses.slice();
        menu.courses = lists[0].items.map(function (k) { return old[parseInt(k, 10)]; });
        var number = 1;
        menu.courses.forEach(function (course) {
          if (/^\d+$/.test(String(course.courseNumber))) course.courseNumber = String(number++);
        });
        return String(menu.courses.indexOf(old[parseInt(key, 10)]));
      },
      tdishes: function (lists, key) {
        var menu = currentTasting();
        var old = menu.courses.map(function (course) { return (course.dishes || []).slice(); });
        function dishAt(k) {
          var parts = k.split(':');
          return old[parseInt(parts[0], 10)][parseInt(parts[1], 10)];
        }
        var moved = dishAt(key);
        var newKey = key;
        lists.forEach(function (list) {
          var c = parseInt(list.key, 10);
          menu.courses[c].dishes = list.items.map(dishAt);
          var at = menu.courses[c].dishes.indexOf(moved);
          if (at !== -1) newKey = c + ':' + at;
        });
        return newKey;
      }
    };

    function commitSort(group, key, before, keepFocus) {
      if (JSON.stringify(readSortLists(group)) === before) return;
      var newKey = sortHandlers[group](readSortLists(group), key);
      touch();
      renderSide();
      keepScroll(renderPage);
      if (group === 'menus') {
        sendPreview();
        postToPreview({ type: 'BELLE_NAVIGATE', target: 'menu-hub' });
      }
      $('moveNote').textContent = 'Moved.';
      if (keepFocus && window.CSS && CSS.escape) {
        var moved = document.querySelector('[data-sort-group="' + group + '"] > [data-sort-item="' + CSS.escape(newKey) + '"] .drag-handle');
        if (moved) moved.focus();
      }
    }

    // Every element reports flex-direction: row by default, so check it is really a flex list
    function isSidewaysList(list) {
      var style = getComputedStyle(list);
      return style.display.indexOf('flex') !== -1 && style.flexDirection.indexOf('row') === 0;
    }

    function closestSortList(group, x, y) {
      var best = null;
      var bestDistance = Infinity;
      document.querySelectorAll('[data-sort-group="' + group + '"]').forEach(function (list) {
        if (!list.getClientRects().length) return;
        var r = list.getBoundingClientRect();
        var dx = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0);
        var dy = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
        if (dx + dy < bestDistance) {
          bestDistance = dx + dy;
          best = list;
        }
      });
      return best;
    }

    function placeHolder(x, y) {
      var s = dragState;
      var list = closestSortList(s.group, x, y);
      if (!list) return;
      var sideways = isSidewaysList(list);
      var next = sortItemsOf(list).filter(function (el) {
        var r = el.getBoundingClientRect();
        return sideways ? x < r.left + r.width / 2 : y < r.top + r.height / 2;
      })[0];
      var anchor = next || sortTailOf(list);
      if (s.holder.parentNode !== list || s.holder.nextElementSibling !== anchor) {
        list.insertBefore(s.holder, anchor);
      }
    }

    function dragScrollLoop() {
      var s = dragState;
      if (!s || !s.lifted) return;
      var box = s.scroller.getBoundingClientRect();
      var alongX = getComputedStyle(s.scroller).display === 'flex';
      var pos = alongX ? s.x : s.y;
      var start = alongX ? box.left : box.top;
      var end = alongX ? box.right : box.bottom;
      var step = pos < start + DRAG_EDGE_SIZE ? -DRAG_EDGE_SPEED : (pos > end - DRAG_EDGE_SIZE ? DRAG_EDGE_SPEED : 0);
      if (step) {
        if (alongX) s.scroller.scrollLeft += step;
        else s.scroller.scrollTop += step;
        placeHolder(s.x, s.y);
      }
      s.frame = requestAnimationFrame(dragScrollLoop);
    }

    function liftDragItem() {
      var s = dragState;
      var rect = s.item.getBoundingClientRect();
      s.grabX = s.startX - rect.left;
      s.grabY = s.startY - rect.top;
      s.holder = document.createElement('div');
      s.holder.className = 'drag-holder';
      // Long sections and courses shrink while carried, so they don't fill the screen
      s.holder.style.height = Math.min(rect.height, DRAG_MAX_HEIGHT) + 'px';
      if (isSidewaysList(s.item.parentNode)) s.holder.style.width = rect.width + 'px';
      s.item.parentNode.insertBefore(s.holder, s.item);
      s.item.style.width = rect.width + 'px';
      s.item.style.maxHeight = DRAG_MAX_HEIGHT + 'px';
      s.item.classList.add('is-lifted');
      document.body.classList.add('is-dragging');
      s.scroller = s.item.closest('.main, .side');
      s.lifted = true;
      s.frame = requestAnimationFrame(dragScrollLoop);
    }

    function onDragMove(e) {
      var s = dragState;
      if (!s || e.pointerId !== s.pointerId) return;
      s.x = e.clientX;
      s.y = e.clientY;
      if (!s.lifted) {
        if (Math.abs(s.x - s.startX) + Math.abs(s.y - s.startY) < DRAG_START_DISTANCE) return;
        liftDragItem();
      }
      e.preventDefault();
      s.item.style.transform = 'translate(' + (s.x - s.grabX) + 'px, ' + (s.y - s.grabY) + 'px)';
      placeHolder(s.x, s.y);
    }

    function stopDrag(apply) {
      var s = dragState;
      if (!s) return;
      dragState = null;
      window.removeEventListener('pointermove', onDragMove);
      window.removeEventListener('pointerup', onDragEnd);
      window.removeEventListener('pointercancel', onDragCancel);
      if (!s.lifted) return;
      cancelAnimationFrame(s.frame);
      document.body.classList.remove('is-dragging');
      s.item.classList.remove('is-lifted');
      s.item.style.transform = '';
      s.item.style.width = '';
      s.item.style.maxHeight = '';
      if (apply) s.holder.parentNode.insertBefore(s.item, s.holder);
      s.holder.remove();
      if (apply) commitSort(s.group, s.key, s.before, false);
    }

    function onDragEnd(e) {
      if (dragState && e.pointerId === dragState.pointerId) stopDrag(true);
    }

    function onDragCancel(e) {
      if (dragState && e.pointerId === dragState.pointerId) stopDrag(false);
    }

    function moveWithKeyboard(handle, direction) {
      var item = handle.closest('[data-sort-item]');
      var list = item.parentNode;
      var group = list.getAttribute('data-sort-group');
      var before = JSON.stringify(readSortLists(group));
      var items = sortItemsOf(list);
      var index = items.indexOf(item);
      var lists = Array.prototype.filter.call(document.querySelectorAll('[data-sort-group="' + group + '"]'), function (el) {
        return el.getClientRects().length > 0;
      });
      var neighbour = lists[lists.indexOf(list) + direction];
      if (direction < 0) {
        if (index > 0) list.insertBefore(item, items[index - 1]);
        else if (neighbour) neighbour.insertBefore(item, sortTailOf(neighbour));
      } else if (index < items.length - 1) {
        list.insertBefore(item, items[index + 1].nextSibling);
      } else if (neighbour) {
        neighbour.insertBefore(item, sortItemsOf(neighbour)[0] || sortTailOf(neighbour));
      }
      commitSort(group, item.getAttribute('data-sort-item'), before, true);
    }

    function bindDragging() {
      document.addEventListener('pointerdown', function (e) {
        var handle = e.target.closest('.drag-handle');
        if (!handle || e.button !== 0 || dragState) return;
        var item = handle.closest('[data-sort-item]');
        var group = item.parentNode.getAttribute('data-sort-group');
        dragState = {
          pointerId: e.pointerId, item: item, group: group, key: item.getAttribute('data-sort-item'),
          before: JSON.stringify(readSortLists(group)),
          startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY, lifted: false
        };
        window.addEventListener('pointermove', onDragMove, { passive: false });
        window.addEventListener('pointerup', onDragEnd);
        window.addEventListener('pointercancel', onDragCancel);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && dragState) {
          stopDrag(false);
          return;
        }
        if (!e.target.closest || !e.target.closest('.drag-handle')) return;
        var direction = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
        if (direction) {
          e.preventDefault();
          moveWithKeyboard(e.target.closest('.drag-handle'), direction);
        }
      });
    }

    /* ========================================================
       CLICKS AND TYPING
       ======================================================== */
    var actions = {
      go: function (el) { go(el.getAttribute('data-page'), el.getAttribute('data-menu')); },
      reviewPublish: reviewPublish,
      checkLive: function () {
        checkLiveAgain().then(function () {
          if (view.page === 'settings') renderPage();
        });
      },
      lock: signOut,
      openPreview: function () {
        document.body.classList.add('preview-open');
        fitPhone();
      },
      closePreview: function () { document.body.classList.remove('preview-open'); },

      addMenu: addMenu,
      renameMenu: renameMenu,
      deleteMenu: deleteMenu,
      addSection: addSection,
      sectionPill: pickSectionPill,
      renameSection: renameSection,
      deleteSection: deleteSection,

      openDish: function (el) { openDish(el.getAttribute('data-menu'), el.getAttribute('data-id')); },
      addDish: addDish,
      saveDish: saveDish,
      cancelDish: cancelDish,
      deleteDish: deleteDish,
      addCut: function () {
        var item = editorDish().item;
        item.cuts = item.cuts || [];
        item.cuts.push({ origin: '', price: '' });
        $('pricePart').innerHTML = pricePartHtml(item);
      },
      removeCut: function (el) {
        var item = editorDish().item;
        item.cuts.splice(parseInt(el.getAttribute('data-i'), 10), 1);
        if (!item.cuts.length) item.cuts.push({ origin: '', price: '' });
        $('pricePart').innerHTML = pricePartHtml(item);
        touch();
      },
      addOption: function () {
        var item = editorDish().item;
        item.options = item.options || [];
        item.options.push({ label: '' });
        $('optionsPart').innerHTML = optionsPartHtml(item);
      },
      removeOption: function (el) {
        var item = editorDish().item;
        item.options.splice(parseInt(el.getAttribute('data-i'), 10), 1);
        $('optionsPart').innerHTML = optionsPartHtml(item);
        touch();
      },
      addExtra: function (el) {
        var kind = el.getAttribute('data-kind');
        var item = editorDish().item;
        var extras = view.editor.extras;
        extras.push({
          badge: kind === 'sides' ? 'SIDES' : (kind === 'addons' ? 'ADD-ONS' : 'NOTE'),
          text: kind === 'sides' ? STANDARD_SIDES : ''
        });
        writeExtras(item, extras);
        $('extrasPart').innerHTML = extrasPartHtml();
        touch();
      },
      removeExtra: function (el) {
        var item = editorDish().item;
        view.editor.extras.splice(parseInt(el.getAttribute('data-i'), 10), 1);
        writeExtras(item, view.editor.extras);
        $('extrasPart').innerHTML = extrasPartHtml();
        touch();
      },
      pickPhoto: pickPhoto,
      deleteMedia: deleteMedia,

      tastingTab: function (el) {
        view.tastingKey = el.getAttribute('data-key');
        renderPage();
      },
      renameTasting: function () {
        var menu = getMenu('tasting');
        askText('Rename this menu', 'Menu name', prettyName(menu.name)).then(function (name) {
          if (!name) return;
          menu.name = name;
          touch();
          render();
        });
      },
      addCourse: function () {
        var menu = appData.tastingMenus[view.tastingKey];
        menu.courses = menu.courses || [];
        menu.courses.push({ courseNumber: String(menu.courses.length + 1), courseName: '', dishes: [{ name: '', desc: '', wine: null }] });
        touch();
        keepScroll(renderPage);
      },
      removeCourse: function (el) {
        var menu = appData.tastingMenus[view.tastingKey];
        var c = parseInt(el.getAttribute('data-c'), 10);
        askConfirm('Remove this course?', 'Course ' + (menu.courses[c].courseName || (c + 1)) + ' and its dishes will be removed.', 'Remove course', true).then(function (yes) {
          if (!yes) return;
          menu.courses.splice(c, 1);
          touch();
          keepScroll(renderPage);
        });
      },
      addTastingDish: function (el) {
        var course = appData.tastingMenus[view.tastingKey].courses[parseInt(el.getAttribute('data-c'), 10)];
        course.dishes = course.dishes || [];
        course.dishes.push({ name: '', desc: '', wine: null });
        touch();
        keepScroll(renderPage);
      },
      removeTastingDish: function (el) {
        var course = appData.tastingMenus[view.tastingKey].courses[parseInt(el.getAttribute('data-c'), 10)];
        course.dishes.splice(parseInt(el.getAttribute('data-d'), 10), 1);
        touch();
        keepScroll(renderPage);
      },

      openEvent: function (el) { openEvent(el.getAttribute('data-id')); },
      addEvent: addEvent,
      saveEvent: saveEvent,
      cancelEvent: cancelEvent,
      deleteEvent: deleteEvent,
      clearEventPhoto: function () {
        var ev = editorEvent();
        ev.imageData = '';
        ev.imageKey = '';
        ev.hasImage = false;
        $('eventPhotos').innerHTML = photoGridHtml('', EVENT_PHOTOS);
        touch();
      },

      discardDraft: discardDraft,
      downloadBackup: downloadBackup,
      downloadDataFile: downloadDataFile,
      undoPublish: undoPublish
    };

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-action]');
      if (!el || e.target.closest('dialog')) return;
      var action = actions[el.getAttribute('data-action')];
      if (action) action(el);
    });

    function bindPageEvents() {
      var page = $('page');

      page.addEventListener('input', function (e) {
        var t = e.target;
        if (t.type === 'file') return;
        if (t.id === 'menuSearch') return applyMenuFilters();
        if (t.id === 'barHours') {
          appData.theGardenAndBar[0].subtitle = t.value;
          return touch();
        }
        if (view.page === 'dish') onDishInput(t);
        else if (view.page === 'tasting') onTastingInput(t);
        else if (view.page === 'event') onEventInput(t);
        else if (view.page === 'contact') onContactInput(t);
      });

      page.addEventListener('change', function (e) {
        var t = e.target;
        if (t.id === 'restoreFile' && t.files[0]) restoreFromFile(t.files[0]);
        else if (t.dataset.upload) onUpload(t);
        if (t.type === 'file') t.value = '';
      });

      // Tidy prices when leaving a price box, so 2800 becomes 2,800
      page.addEventListener('focusout', function (e) {
        var t = e.target;
        if (t.hasAttribute && t.hasAttribute('data-price') && t.value) {
          var tidy = formatPrice(t.value);
          if (tidy !== t.value) {
            t.value = tidy;
            t.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      });

      page.addEventListener('submit', function (e) {
        if (e.target.id === 'passForm') changePassword(e);
      });
    }

    function bindGlobalKeys() {
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          if ($('app').hidden || !appData) return;
          if (view.page === 'dish') saveDish();
          else if (view.page === 'event') saveEvent();
          else {
            commitDraft();
            toast('Saved. Press Publish when you are ready.');
          }
        }
      });

      window.addEventListener('beforeunload', function (e) {
        if (saveTimer) commitDraft();
        if (storageFailed) e.preventDefault();
      });
    }

    /* ========================================================
       START
       ======================================================== */
    window.addEventListener('DOMContentLoaded', function () {
      renderStatus();
      bindSignIn();
      bindPageEvents();
      bindGlobalKeys();
      bindDragging();

      $('previewFrame').addEventListener('load', showPreviewForPage);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(fitPhone).observe($('phoneStage'));
      }
      window.addEventListener('resize', fitPhone);

      startSignIn();
    });
  </script>
</body>
</html>
