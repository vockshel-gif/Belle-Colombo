<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Belle Colombo Admin</title>
  <link rel="icon" href="Logo/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="belleData.js"></script>
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #ffffff;
      --surface-2: #faf8f4;
      --line: #e5e0d7;
      --line-strong: #cbc4b7;
      --text: #1b1a18;
      --text-2: #57534b;
      --text-3: #736e65;
      --gold: #8c7349;
      --gold-soft: #f4eee2;
      --ok: #1f7a4d;
      --ok-soft: #e6f3ec;
      --warn: #96590a;
      --warn-soft: #fbf0dc;
      --bad: #b3261e;
      --bad-soft: #fbe9e7;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(27, 26, 24, 0.06);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--text-3); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--text); border-color: var(--text); color: #fff; }
    .btn-primary:hover { background: #33312d; border-color: #33312d; }
    .btn-danger { color: var(--bad); border-color: #e3b3ae; }
    .btn-danger:hover { background: var(--bad-soft); border-color: var(--bad); }
    .btn-sm { min-height: 34px; padding: 4px 10px; font-size: 13px; }
    .btn-block { width: 100%; }
    .btn-link {
      background: none;
      border: 0;
      padding: 2px 0;
      color: var(--text-2);
      font-weight: 600;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .btn-link:hover { color: var(--text); }
    .btn-link.danger { color: var(--bad); }

    /* ---------- Sign in ---------- */
    .login {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .login-card img { width: 170px; height: auto; margin: 0 auto 4px; }
    .login-card h1 { font-size: 21px; text-align: center; }
    .login-card > p { color: var(--text-2); font-size: 14px; text-align: center; }
    .login-card > a { color: var(--text-2); font-size: 13px; text-align: center; }
    .login-card > .btn-link { align-self: center; }
    .form-note {
      padding: 10px 12px;
      background: var(--ok-soft);
      color: var(--ok);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .pass-wrap { position: relative; }
    .pass-wrap input[type] { padding-right: 64px; }
    .pass-wrap button {
      position: absolute;
      top: 4px;
      right: 4px;
      bottom: 4px;
      padding: 0 12px;
      background: none;
      border: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }
    .form-error {
      padding: 10px 12px;
      background: var(--bad-soft);
      color: var(--bad);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    /* ---------- App frame ---------- */
    .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .topbar-brand img { width: 92px; height: auto; display: block; }
    .topbar-brand span { font-size: 13px; font-weight: 600; color: var(--text-3); }
    .topbar-status { flex: 1; display: flex; justify-content: center; min-width: 0; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); flex: none; }
    .status-pill.is-ok { background: var(--ok-soft); border-color: #bfe0cd; color: var(--ok); }
    .status-pill.is-ok .dot { background: var(--ok); }
    .status-pill.is-warn { background: var(--warn-soft); border-color: #eed7ae; color: var(--warn); }
    .status-pill.is-warn .dot { background: var(--warn); }
    .status-pill.is-bad { background: var(--bad-soft); border-color: #eec5c0; color: var(--bad); }
    .status-pill.is-bad .dot { background: var(--bad); }
    .only-small { display: none; }

    .shell {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr) 390px;
      min-height: 0;
    }
    .shell.no-preview { grid-template-columns: 232px minmax(0, 1fr); }
    .shell.no-preview .preview { display: none; }

    /* ---------- Left navigation ---------- */
    .side {
      overflow-y: auto;
      padding: 14px 10px 24px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .side-label {
      padding: 14px 12px 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-3);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      background: none;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      text-align: left;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.is-active { background: var(--gold-soft); color: var(--text); }
    .nav-item svg { flex: none; }
    .nav-item .nav-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item .count { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .nav-item.is-add { color: var(--gold); font-size: 13px; min-height: 36px; }
    .nav-menus { display: flex; flex-direction: column; }
    .nav-row { display: flex; align-items: center; background: var(--surface); }
    .nav-row .drag-handle { width: 20px; min-height: 36px; }
    .nav-row .nav-item { flex: 1; min-width: 0; padding-left: 4px; }
    @media (hover: hover) and (pointer: fine) {
      .nav-row .drag-handle { opacity: 0; }
      .nav-row:hover .drag-handle, .nav-row .drag-handle:focus-visible { opacity: 1; }
    }

    /* ---------- Main page ---------- */
    .main { overflow-y: auto; padding: 24px 28px 72px; outline: none; }
    .page { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .page-head h1 { font-size: 25px; line-height: 1.25; }
    .page-head p { color: var(--text-2); margin-top: 3px; max-width: 58ch; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      align-self: flex-start;
      background: none;
      border: 0;
      padding: 4px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }
    .back-link:hover { color: var(--text); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-pad { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 16px; font-weight: 700; }
    .card-hint { font-size: 14px; color: var(--text-2); margin-top: -8px; }
    .note {
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 14px;
      font-weight: 500;
    }
    .note.is-info { background: var(--gold-soft); color: #5f4c2d; }
    .note.is-bad { background: var(--bad-soft); color: var(--bad); }

    /* ---------- Overview ---------- */
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .step { padding: 14px 16px; background: var(--surface-2); border-radius: 8px; }
    .step b { display: block; margin-bottom: 2px; font-size: 14px; }
    .step span { font-size: 14px; color: var(--text-2); }
    .step .step-num {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      margin-bottom: 8px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .issue {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .issue:first-of-type { border-top: 0; padding-top: 2px; }
    .issue p { font-size: 14px; }
    .issue p b { font-weight: 600; }
    .issue-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: none; max-width: 50%; }
    .all-good { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; font-size: 14px; }

    /* ---------- Dish and event lists ---------- */
    .search { position: relative; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
    .search input[type='search'] { padding-left: 38px; }
    .section-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .section-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      white-space: nowrap;
      cursor: pointer;
    }
    .section-pill:hover { border-color: var(--text-3); color: var(--text); }
    .section-pill.is-active { background: var(--text); border-color: var(--text); color: #fff; }
    .section-pill .count { font-weight: 500; opacity: 0.7; }
    .is-one-section .section-title .drag-handle { display: none; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .section-head h2 { font-size: 15px; font-weight: 700; }
    .section-head span { font-size: 13px; color: var(--text-3); font-weight: 500; }
    .section-tools { display: flex; align-items: center; gap: 12px; flex: none; }
    .row { display: flex; align-items: stretch; background: var(--surface); border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row:hover { background: var(--surface-2); }
    .row:last-child { border-radius: 0 0 var(--radius) var(--radius); }
    .row-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      padding: 10px 16px 10px 2px;
      background: none;
      border: 0;
      text-align: left;
      cursor: pointer;
    }
    .row-main:first-child, .is-filtered .row-main { padding-left: 16px; }

    /* ---------- Drag to rearrange ---------- */
    .drag-handle {
      display: grid;
      place-items: center;
      flex: none;
      width: 34px;
      min-height: 44px;
      padding: 0;
      background: none;
      border: 0;
      border-radius: 6px;
      color: var(--text-3);
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:hover { color: var(--text); background: var(--bg); }
    .is-filtered .drag-handle { display: none; }
    .is-lifted {
      position: fixed !important;
      left: 0;
      top: 0;
      z-index: 60;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 14px 34px rgba(27, 26, 24, 0.24);
    }
    .drag-holder {
      flex: none;
      border: 2px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--gold-soft);
    }
    body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
    .menu-sections, .tasting-courses { display: flex; flex-direction: column; gap: 18px; }
    .course-dishes { display: flex; flex-direction: column; gap: 10px; }
    .sort-list { min-height: 10px; }
    .sort-list:has(.row) .empty, .sort-list:has(.drag-holder) .empty { display: none; }
    .section-title { display: flex; align-items: center; gap: 2px; min-width: 0; }
    .section-title .drag-handle { margin-left: -8px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .thumb {
      width: 52px;
      height: 52px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-3);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row-text { flex: 1; min-width: 0; }
    .row-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .row-sub {
      display: block;
      font-size: 13px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-price { flex: none; text-align: right; font-weight: 600; font-size: 14px; }
    .row-price.is-missing { color: var(--bad); }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
    }
    .chip-veg { background: var(--ok-soft); color: var(--ok); }
    .chip-warn { background: var(--warn-soft); color: var(--warn); }
    .chip-ok { background: var(--ok-soft); color: var(--ok); }
    .empty { padding: 22px 16px; text-align: center; color: var(--text-2); font-size: 14px; }
    .date-box {
      width: 52px;
      flex: none;
      padding: 6px 0;
      border-radius: 8px;
      background: var(--bg);
      text-align: center;
      line-height: 1.15;
    }
    .date-box b { display: block; font-size: 18px; }
    .date-box span { font-size: 11px; font-weight: 700; color: var(--text-2); }

    /* ---------- Forms ---------- */
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field > label, .field-label { font-size: 14px; font-weight: 600; }
    .field-hint { font-size: 13px; color: var(--text-3); }
    .field-error { font-size: 13px; color: var(--bad); font-weight: 500; }
    input[type='text'], input[type='email'], input[type='password'], input[type='url'], input[type='date'], input[type='search'], select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-size: 15px;
    }
    textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--text); }
    .choice-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice-group label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: var(--surface);
    }
    .choice-group label:has(input:checked) { border-color: var(--text); background: var(--gold-soft); font-weight: 600; }
    .choice-group input { accent-color: var(--text); margin: 0; }
    .repeat-list { display: flex; flex-direction: column; gap: 8px; }
    .repeat-row { display: grid; gap: 8px; align-items: center; }
    .repeat-price { grid-template-columns: minmax(0, 1fr) 130px auto auto; }
    .repeat-two { grid-template-columns: minmax(0, 1fr) 130px; }
    .repeat-option { grid-template-columns: minmax(0, 1fr) auto auto; }
    .repeat-extra { grid-template-columns: 130px minmax(0, 1fr) auto; }
    .add-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
    .photo-pick {
      position: relative;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
      cursor: pointer;
      aspect-ratio: 1;
    }
    .photo-pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-pick.is-picked { border-color: var(--text); box-shadow: 0 0 0 2px var(--text); }
    .sticky-actions {
      position: sticky;
      bottom: -72px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 16px;
      margin-bottom: -48px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 -4px 14px rgba(27, 26, 24, 0.07);
    }
    .sticky-actions .spacer { flex: 1; }

    /* ---------- Tasting editor ---------- */
    .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #ece7dd; border-radius: 10px; align-self: flex-start; flex-wrap: wrap; }
    .tabs button {
      min-height: 38px;
      padding: 6px 16px;
      background: none;
      border: 0;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }
    .tabs button.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .course-dish {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .course-head { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: end; }
    .card-drag-row { display: flex; align-items: center; gap: 6px; margin: -6px 0 -4px -8px; font-size: 13px; font-weight: 600; color: var(--text-3); }

    /* ---------- Photos and videos ---------- */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .media-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .media-preview { aspect-ratio: 4 / 3; background: var(--bg); }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-info { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 10px 12px 12px; font-size: 13px; }
    .media-uses { color: var(--text-2); line-height: 1.6; }
    .media-uses .btn-link { font-size: 13px; text-align: left; }
    .media-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .media-heading h2 { font-size: 17px; }
    .media-heading p { font-size: 14px; color: var(--text-2); }
    .upload-preview { max-height: 170px; width: 100%; object-fit: cover; border-radius: 8px; display: block; }

    /* ---------- Size meter ---------- */
    .meter { height: 10px; border-radius: 999px; background: var(--bg); overflow: hidden; }
    .meter span { display: block; height: 100%; background: var(--ok); }
    .meter.is-high span { background: var(--warn); }

    /* ---------- Phone preview ---------- */
    .preview {
      display: flex;
      flex-direction: column;

    function $(id) { return document.getElementById(id); }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    function readStore(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function writeStore(key, value) {
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }
    function dropStore(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }
    function readJson(key) {
      try {
        var raw = readStore(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;

    }

    function slugify(text) {
      return String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

    }

    function openDialog(opts) {
      return new Promise(function (resolve) {
        var dlg = $('dialog');
        var actions = opts.actions || [{ id: 'ok', label: 'OK', style: 'primary' }];
        var primary = actions.filter(function (a) { return a.style === 'primary' || a.style === 'danger'; })[0] || actions[0];
        dlg.className = opts.wide ? 'is-wide' : '';
        dlg.innerHTML = '<form class="dlg-form" method="dialog">' +

          (opts.text ? '<p class="dlg-text">' + esc(opts.text) + '</p>' : '') +
          (opts.html || '') +

            var cls = a.style === 'primary' ? 'btn btn-primary' : (a.style === 'danger' ? 'btn btn-danger' : 'btn');

          }).join('') + '</div>' +
        '</form>';

        function finish(result) {
          dlg.onclick = null;
          dlg.oncancel = null;
          var inputEl = dlg.querySelector('[data-dlg-input]');
          var value = inputEl ? inputEl.value : undefined;
          dlg.close();
          resolve({ action: result, value: value });
        }
        dlg.onclick = function (e) {
          var btn = e.target.closest('[data-dlg]');
          if (btn) {
            e.preventDefault();
            finish(btn.getAttribute('data-dlg'));
          }
        };
        dlg.oncancel = function (e) {
          e.preventDefault();
          finish(null);
        };
        dlg.querySelector('form').onsubmit = function (e) {
          e.preventDefault();
          finish(primary.id);
        };
        dlg.showModal();
        var focusEl = dlg.querySelector('[data-dlg-input]');
        if (focusEl && focusEl.select) focusEl.select();
      });
    }

    function normalizeData(data) {

      d.subCategories = d.subCategories || {};
      d.menuCategories = d.menuCategories || [];

      if (!d.menuCategories.length) {
        d.menuCategories = [
          { id: 'lunch', name: 'LUNCH', type: 'standard', isSystem: true },
          { id: 'alacarte', name: 'À LA CARTE', type: 'courses', isSystem: true },
          { id: 'tasting', name: 'TASTING MENUS', type: 'tasting', isSystem: true },
          { id: 'thebar', name: 'THE BAR', type: 'bar', isSystem: true }
        ];
      }

      // Custom menus used to be stored twice; keep the one in menuCategories
      (d.customCategories || []).forEach(function (custom) {
        if (!d.menuCategories.some(function (c) { return c.id === custom.id; })) {
          d.menuCategories.push(custom);
        }
      });
      d.customCategories = [];
      d.menuCategories = d.menuCategories.filter(function (c) { return c.id !== 'cat-breakfast'; });
      delete d.subCategories['cat-breakfast'];

      d.menuCategories.forEach(function (cat) {
        if (cat.isSystem) return;
        cat.items = cat.items || [];
        d.subCategories[cat.id] = d.subCategories[cat.id] || cat.subCategories || [];
      });

      [d.aLaCarte, d.theGardenAndBar].forEach(function (groups) {
        groups.forEach(function (group) {
          group.items = group.items || [];
          delete group.isTemporaryFolder;
        });
      });
      return d;
    }

    function stripPublishInfo(data) {
      if (data) delete data.publishedAt;
      return data;
    }

    function isMenuData(data) {
      return !!(data && typeof data === 'object' && Array.isArray(data.lunchItems) && Array.isArray(data.aLaCarte) && Array.isArray(data.theGardenAndBar) && data.tastingMenus && data.venue);
    }

    function isGroupMenu(menuId) { return menuId === 'alacarte' || menuId === 'thebar'; }
    function isSystemMenu(menuId) { return ['lunch', 'alacarte', 'thebar', 'tasting'].indexOf(menuId) !== -1; }

    function getMenu(menuId, data) {
      return ((data || appData).menuCategories || []).find(function (c) { return c.id === menuId; }) || null;
    }

    function menuLabel(menuId, data) {
      var menu = getMenu(menuId, data);
      return menu ? prettyName(menu.name) : '';
    }

    function menuGroups(menuId, data) {
      var d = data || appData;
      return menuId === 'alacarte' ? d.aLaCarte : d.theGardenAndBar;
    }

    function menuList(menuId, data) {
      var d = data || appData;

    }

    function sectionNames(menuId) {

    // A section is a named group of dishes shown together on the menu page
    function getSections(menuId) {
      if (isGroupMenu(menuId)) {
        return menuGroups(menuId).map(function (group) {

      var sections = names.map(function (name) {
        return { key: name, name: name, items: items.filter(function (it) { return it.subCategory === name; }), canEdit: true };
      });
      var loose = items.filter(function (it) { return names.indexOf(it.subCategory) === -1; });
      if (loose.length || !names.length) {
        sections.push({ key: '', name: names.length ? 'No section' : 'Dishes', items: loose, canEdit: false });
      }
      return sections;
    }

    function countDishes(menuId, data) {
      if (menuId === 'tasting') return 2;
      if (isGroupMenu(menuId)) {
        return menuGroups(menuId, data).reduce(function (sum, g) { return sum + (g.items || []).length; }, 0);
      }
      return menuList(menuId, data).length;
    }

    function allDishes(data) {
      var d = data || appData;
      var out = [];
      (d.menuCategories || []).forEach(function (menu) {
        if (menu.id === 'tasting') return;
        var lists = isGroupMenu(menu.id)
          ? menuGroups(menu.id, d).map(function (g) { return g.items || []; })
          : [menuList(menu.id, d)];
        lists.forEach(function (list) {
          list.forEach(function (item) {
            out.push({ item: item, menuId: menu.id, area: prettyName(menu.name) });
          });
        });
      });
      return out;
    }

    function findDish(menuId, dishId) {
      var lists = isGroupMenu(menuId)
        ? menuGroups(menuId).map(function (g) { return { list: g.items, group: g }; })
        : [{ list: menuList(menuId), group: null }];
      for (var i = 0; i < lists.length; i++) {
        var idx = lists[i].list.findIndex(function (it) { return it.id === dishId; });
        if (idx !== -1) {
          return { item: lists[i].list[idx], list: lists[i].list, index: idx, group: lists[i].group };
        }
      }
      return null;
    }

    function hasCuts(item) { return Array.isArray(item.cuts) && item.cuts.length > 0; }

    function isVegDish(item) {
      return !!item.isVeg || (item.tags || []).indexOf('Vegetarian') !== -1;
    }

    function dishPriceText(item) {
      if (hasCuts(item)) {
        return item.cuts.map(function (c) { return c.price; }).filter(Boolean).join(' / ');
      }
      return [item.price, item.price2].filter(Boolean).join(' / ');
    }

    /* ========================================================
       COMPARING THE DRAFT WITH THE LIVE SITE
       ======================================================== */
    function isPresent(value) { return value !== undefined && value !== null && value !== ''; }

    // Firebase drops empty values, so compare with those removed and keys in a fixed order
    function canon(value) {
      if (Array.isArray(value)) {
        var arr = value.map(canon).filter(isPresent);
        return arr.length ? arr : undefined;
      }
      if (value && typeof value === 'object') {
        var out = {};
        Object.keys(value).sort().forEach(function (key) {
          var v = canon(value[key]);
          if (isPresent(v)) out[key] = v;
        });
        return Object.keys(out).length ? out : undefined;
      }
      return value;
    }

    function sameContent(a, b) {
      return JSON.stringify(canon(a)) === JSON.stringify(canon(b));
    }

    function menuStructure(d) {
      return {
        menus: d.menuCategories.map(function (c) { return { id: c.id, name: c.name }; }),
        sections: d.subCategories,
        courses: d.aLaCarte.map(function (c) { return { key: c.key, name: c.category }; }),
        bar: d.theGardenAndBar.map(function (c) { return { key: c.key, name: c.category, hours: c.subtitle }; })
      };
    }

    function listChanges(before, after) {
      var changes = [];
      function add(kind, area, name) { changes.push({ kind: kind, area: area, name: name || 'Unnamed' }); }

      var oldDishes = {};
      var newDishes = {};
      allDishes(before).forEach(function (d) { oldDishes[d.item.id] = d; });
      allDishes(after).forEach(function (d) { newDishes[d.item.id] = d; });
      Object.keys(newDishes).forEach(function (id) {
        var now = newDishes[id];
        if (!oldDishes[id]) add('Added', now.area, now.item.name);
        else if (!sameContent(oldDishes[id].item, now.item)) add('Changed', now.area, now.item.name);
      });
      Object.keys(oldDishes).forEach(function (id) {
        if (!newDishes[id]) add('Removed', oldDishes[id].area, oldDishes[id].item.name);
      });

      ['fiveCourse', 'sevenCourse'].forEach(function (key) {
        var menu = after.tastingMenus[key];
        if (menu && !sameContent(before.tastingMenus[key], menu)) {
          add('Changed', 'Tasting Menus', prettyName(menu.shortTitle || menu.title));
        }
      });

      var oldEvents = {};
      var newEvents = {};
      before.events.forEach(function (ev) { oldEvents[ev.id] = ev; });
      after.events.forEach(function (ev) { newEvents[ev.id] = ev; });
      after.events.forEach(function (ev) {
        if (!oldEvents[ev.id]) add('Added', 'Events', ev.title);
        else if (!sameContent(oldEvents[ev.id], ev)) add('Changed', 'Events', ev.title);
      });
      before.events.forEach(function (ev) {
        if (!newEvents[ev.id]) add('Removed', 'Events', ev.title);
      });

      after.menuCategories.forEach(function (menu) {
        function dishIdsOf(data) {
          return allDishes(data).filter(function (d) { return d.menuId === menu.id; }).map(function (d) { return d.item.id; });
        }
        var oldIds = dishIdsOf(before);
        var newIds = dishIdsOf(after);
        var keptOld = oldIds.filter(function (id) { return newIds.indexOf(id) !== -1; });
        var keptNew = newIds.filter(function (id) { return oldIds.indexOf(id) !== -1; });
        if (keptOld.join() !== keptNew.join()) add('Rearranged', prettyName(menu.name), 'The order of dishes');
      });

      if (!sameContent(before.venue, after.venue)) add('Changed', 'Contact & Hours', 'Contact details');
      if (!sameContent(menuStructure(before), menuStructure(after))) add('Changed', 'Menus', 'Menu or section names or their order');
      if (!changes.length && !sameContent(before, after)) add('Changed', 'Menus', 'The order of items');
      return changes;
    }

    /* ========================================================
       SAVING THE DRAFT
       ======================================================== */
    function refreshStatus() {
      if (sync.state === 'publishing') return renderStatus();
      if (!liveData) {
        sync.state = 'offline';
        sync.changes = [];
      } else {
        sync.changes = listChanges(liveData, appData);
        sync.state = sync.changes.length ? 'pending' : 'live';
      }
      renderStatus();
    }

    function commitDraft() {
      clearTimeout(saveTimer);
      saveTimer = null;
      if (!appData) return;
      refreshStatus();
      var text = JSON.stringify(appData);
      var meta = { baseRevision: liveRevision, dirty: sync.state !== 'live', savedAt: Date.now() };
      if (!liveData) {
        // Offline there is nothing to compare with, so keep what was known and only note real edits
        var known = readJson(DRAFT_META_KEY) || { baseRevision: 0, dirty: false };
        var stored = readStore(DRAFT_KEY);
        meta.baseRevision = known.baseRevision;
        meta.dirty = known.dirty || (stored !== null && stored !== text);
      }
      var saved = writeStore(DRAFT_KEY, text);
      saved = writeStore(DRAFT_META_KEY, JSON.stringify(meta)) && saved;
      if (storageFailed !== !saved) {
        storageFailed = !saved;
        renderPage();
      }
      sendPreview();
    }

    // Call after any edit: the draft saves itself shortly after the last keystroke
    function touch() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(commitDraft, 250);
      clearTimeout(previewTimer);
      previewTimer = setTimeout(sendPreview, 120);
    }

    /* ========================================================
       TALKING TO THE LIVE SITE
       ======================================================== */
    function firebaseRequest(options, url) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, NETWORK_TIMEOUT_MS);
      var init = Object.assign({ cache: 'no-store', signal: controller.signal }, options || {});
      return fetch(url || FIREBASE_URL, init).then(function (res) {
        clearTimeout(timer);
        if (!res.ok) {
          var err = new Error('HTTP ' + res.status);
          err.status = res.status;
          throw err;
        }
        return res.status === 204 ? null : res.json();
      }, function (err) {
        clearTimeout(timer);
        throw err;
      });
    }

    function adoptLive(cloud) {
      liveRevision = (cloud && cloud.publishedAt) || 0;
      liveData = normalizeData(stripPublishInfo(clone(cloud || {})));
    }

    function chooseWorkingCopy(fileData) {
      // A live copy with no publish date came from before this version and is older than belleData.js
      var latest = liveRevision ? clone(liveData) : fileData;
      var meta = readJson(DRAFT_META_KEY);
      var draft = readJson(DRAFT_KEY);

      if (draft && meta && meta.dirty) {
        draft = normalizeData(draft);
        if (meta.baseRevision === liveRevision) return Promise.resolve(draft);
        return openDialog({
          title: 'The live site was updated somewhere else',
          text: 'Someone published from another computer since you last worked here. You also have unpublished changes on this computer.',
          actions: [
            { id: 'live', label: 'Use the live version' },
            { id: 'mine', label: 'Keep my changes', style: 'primary' }
          ]
        }).then(function (r) { return r.action === 'mine' ? draft : latest; });
      }

      var legacy = readJson(LEGACY_DRAFT_KEY);
      if (legacy) {
        legacy = normalizeData(stripPublishInfo(legacy));
        dropStore(LEGACY_DRAFT_KEY);
        if (!sameContent(legacy, liveData) && !sameContent(legacy, fileData)) {
          writeStore(LEGACY_DRAFT_BACKUP_KEY, JSON.stringify(legacy));
          return openDialog({
            title: 'We found older edits on this computer',
            text: 'These were saved by the previous admin panel and are not on the live site. Do you want to keep working from them, or start from the latest menu?',
            actions: [
              { id: 'latest', label: 'Start from the latest menu' },
              { id: 'legacy', label: 'Use my older edits', style: 'primary' }
            ]
          }).then(function (r) { return r.action === 'legacy' ? legacy : latest; });
        }
      }
      return Promise.resolve(latest);
    }

    function startData() {
      var fileData = normalizeData(clone(window.BELLE_DEFAULT_DATA || {}));
      sync.state = 'checking';
      renderStatus();
      firebaseRequest().then(function (cloud) {
        adoptLive(cloud);
        return chooseWorkingCopy(fileData);
      }, function () {
        // The live site could not be read: carry on from what this computer has
        liveData = null;
        var local = readJson(DRAFT_KEY) || readJson(LEGACY_DRAFT_KEY);
        return local ? normalizeData(stripPublishInfo(local)) : fileData;
      }).then(function (working) {
        appData = working;
        commitDraft();
        render();
        showPreviewForPage();
      });
    }

    function checkLiveAgain() {
      var hadChanges = !liveData || listChanges(liveData, appData).length > 0;
      var previousRevision = liveRevision;
      sync.state = 'checking';
      renderStatus();
      return firebaseRequest().then(function (cloud) {
        adoptLive(cloud);
        if (liveRevision !== previousRevision && !hadChanges) {
          appData = clone(liveData);
          render();
        }
        commitDraft();
      }, function () {
        liveData = null;
        refreshStatus();
        toast('Could not reach the live site. Check your internet connection.');
      });
    }

    function publishProblems() {
      var problems = [];
      if (!isMenuData(appData)) problems.push('The menu data is incomplete.');
      if (allDishes().length === 0) problems.push('There are no dishes in any menu.');
      allDishes().forEach(function (d) {
        if (!String(d.item.name || '').trim()) problems.push('A dish on ' + d.area + ' has no name.');
      });
      appData.events.forEach(function (ev) {
        if (!String(ev.title || '').trim()) problems.push('An event has no title.');
      });
      return problems;
    }

    function publishErrorText(err) {
      if (err && (err.status === 401 || err.status === 403)) {
        return 'Firebase refused the update (error ' + err.status + '), so nothing changed on the live site. Your database rules need to allow this account. Its User ID is ' + account.uid + '. Your work is still saved on this computer.';
      }
      if (err && err.status) {
        return 'Firebase returned error ' + err.status + ', so nothing changed on the live site. Your work is still saved on this computer.';
      }
      return 'The update did not reach Firebase, so nothing changed on the live site. Check your internet connection and try again. Your work is still saved on this computer.';
    }

    function reviewPublish() {
      commitDraft();
      if (sync.state !== 'pending') return;

      var problems = publishProblems();
      if (problems.length) {
        openDialog({
          title: 'Fix this before publishing',
          html: '<div class="change-list"><ul>' + problems.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>'
        });
        return;
      }

      var areas = {};
      sync.changes.forEach(function (c) { (areas[c.area] = areas[c.area] || []).push(c); });
      var listHtml = Object.keys(areas).map(function (area) {
        return '<div class="change-group"><b>' + esc(area) + '</b><ul>' + areas[area].map(function (c) {
          return '<li>' + esc(c.kind) + ': ' + esc(c.name) + '</li>';
        }).join('') + '</ul></div>';
      }).join('');

      openDialog({
        title: 'Publish to the live site?',
        text: plural(sync.changes.length, 'change') + ' will go live. New visitors see them right away, and anyone already on the site within 5 minutes.',
        html: '<div class="change-list">' + listHtml + '</div>',
        wide: true,
        actions: [
          { id: 'no', label: 'Not yet' },
          { id: 'yes', label: 'Publish now', style: 'primary' }
        ]
      }).then(function (r) {
        if (r.action === 'yes') publishNow();
      });
    }

    function publishNow() {
      sync.state = 'publishing';
      renderStatus();

      // Checking only the version number saves downloading the whole menu again
      firebaseRequest(null, FIREBASE_VERSION_URL).then(function (version) {
        if ((version || 0) === liveRevision) return true;
        return openDialog({
          title: 'The live site changed while you were working',
          text: 'Someone published from another computer. Publishing now will replace what they did with your version.',
          actions: [
            { id: 'no', label: 'Stop' },
            { id: 'yes', label: 'Replace it with mine', style: 'danger' }
          ]
        }).then(function (r) {
          if (r.action !== 'yes') return false;
          return firebaseRequest().then(function (cloud) {
            adoptLive(cloud);
            return true;
          });
        });
      }).then(function (shouldPublish) {
        if (!shouldPublish) {
          sync.state = 'pending';
          refreshStatus();
          return;
        }
        var stamp = Date.now();
        var payload = clone(appData);
        payload.publishedAt = stamp;
        if (liveData) writeStore(LIVE_BACKUP_KEY, JSON.stringify({ savedAt: stamp, data: liveData }));
        return getIdToken().then(function (token) {
          // print=silent stops Firebase sending the whole menu back, which would count as a download
          return firebaseRequest({
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }, FIREBASE_URL + '?print=silent&auth=' + encodeURIComponent(token));
        }).then(function () {
          liveData = clone(appData);
          liveRevision = stamp;
          sync.state = 'live';
          commitDraft();
          renderSide();
          if (view.page === 'home' || view.page === 'settings') renderPage();
          toast('Published. New visitors see it now, and anyone on the site within 5 minutes.');
        });
      }).catch(function (err) {
        sync.state = 'pending';
        refreshStatus();
        if (err && err.authCode) {
          signOut('Your sign-in has ended, so that did not publish. Sign in again and press Publish. Your changes are saved on this computer.');
          return;
        }
        openDialog({ title: 'That did not publish', text: publishErrorText(err) });
      });
    }

    /* ========================================================
       PHONE PREVIEW
       ======================================================== */
    function previewMessageTarget() {
      return window.location.protocol === 'file:' ? '*' : window.location.origin;
    }

    function postToPreview(message) {
      var frame = $('previewFrame');
      if (frame && frame.contentWindow) frame.contentWindow.postMessage(message, previewMessageTarget());
    }

    function sendPreview() {
      clearTimeout(previewTimer);
      if (appData) postToPreview({ type: 'BELLE_DATA_UPDATE', payload: appData });
    }

    function previewPageTarget() {
      if (view.page === 'events' || view.page === 'event') return 'events';
      if (view.page === 'tasting') return 'tasting';
      if (view.page === 'menu' || view.page === 'dish') {
        if (view.menuId === 'alacarte') {
          var openDishRef = view.editor && view.editor.kind === 'dish' ? findDish(view.menuId, view.editor.id) : null;
          if (openDishRef && openDishRef.group) return openDishRef.group.key;
          var chosenCourse = view.page === 'menu' ? chosenSection('alacarte') : null;
          if (chosenCourse) return chosenCourse;
          return appData.aLaCarte[0] ? appData.aLaCarte[0].key : 'menu-hub';
        }
        // A menu with no dishes is only a blank page, so show it in the list of menus instead
        if (!isSystemMenu(view.menuId) && !countDishes(view.menuId)) return 'menu-hub';
        return view.menuId;
      }
      return 'home';
    }

    // Which pill the phone should show, so it matches what is on screen here
    function previewSubcat() {
      if (view.menuId === 'alacarte' || (view.page !== 'menu' && view.page !== 'dish')) return null;
      if (view.page === 'dish') {
        var found = editorDish();
        if (!found) return 'all';
        return found.group ? found.group.key : (found.item.subCategory || 'all');
      }
      var chosen = chosenSection(view.menuId);
      return chosen ? chosen : 'all';
    }

    function showPreviewForPage() {
      if (!appData) return;
      sendPreview();
      postToPreview({ type: 'BELLE_NAVIGATE', target: previewPageTarget(), subcat: previewSubcat() });
    }

    function fitPhone() {
      var stage = $('phoneStage');
      if (!stage.clientWidth || !stage.clientHeight) return;
      var scale = Math.min(1, stage.clientHeight / 872, stage.clientWidth / 413);
      $('phone').style.transform = 'scale(' + scale + ')';
      $('phoneBox').style.width = Math.floor(413 * scale) + 'px';
      $('phoneBox').style.height = Math.floor(872 * scale) + 'px';
    }

    /* ========================================================
       TOP BAR AND LEFT NAVIGATION
       ======================================================== */
    function renderStatus() {
      var slot = $('statusSlot');
      var btn = $('publishBtn');
      var count = sync.changes.length;
      var map = {
        checking: { cls: '', text: 'Checking the live site…' },
        publishing: { cls: '', text: 'Publishing…' },
        live: { cls: 'is-ok', text: 'Everything is live' },
        pending: { cls: 'is-warn', text: plural(count, 'change') + ' not live yet' },
        offline: { cls: 'is-bad', text: "Can't reach the live site" }
      };
      var info = map[sync.state];
      slot.innerHTML = '<span class="status-pill ' + info.cls + '"><span class="dot"></span>' + esc(info.text) + '</span>' +
        (sync.state === 'offline' ? ' <button type="button" class="btn btn-sm" style="margin-left:8px" data-action="checkLive">Try again</button>' : '');
      btn.disabled = sync.state !== 'pending';
      btn.textContent = sync.state === 'publishing' ? 'Publishing…' : (sync.state === 'pending' ? 'Publish ' + count : 'Publish');
    }

    function navItemHtml(label, iconName, page, menuId, count) {
      var isActive = view.page === page && (view.menuId || null) === (menuId || null);
      var isMenuChild = menuId && (view.page === 'dish') && view.menuId === menuId;
      var isEventChild = page === 'events' && view.page === 'event';
      var active = isActive || isMenuChild || isEventChild;
      return '<button type="button" class="nav-item' + (active ? ' is-active' : '') + '" data-action="go" data-page="' + page + '"' +
        (menuId ? ' data-menu="' + esc(menuId) + '"' : '') + (active ? ' aria-current="page"' : '') + '>' +
        icon(iconName) + '<span class="nav-name">' + esc(label) + '</span>' +
        (count !== undefined ? '<span class="count">' + count + '</span>' : '') +
      '</button>';
    }

    function renderSide() {
      var html = navItemHtml('Overview', 'home', 'home');
      html += '<div class="side-label">Menus</div>';
      html += '<div class="nav-menus" data-sort-list="menus" data-sort-group="menus">';
      appData.menuCategories.forEach(function (menu) {
        var page = menu.id === 'tasting' ? 'tasting' : 'menu';
        var iconName = (menu.id === 'tasting' || menu.id === 'thebar') ? 'glass' : 'plate';
        html += '<div class="nav-row" data-sort-item="' + esc(menu.id) + '">' + dragHandleHtml(prettyName(menu.name)) +
          navItemHtml(prettyName(menu.name), iconName, page, menu.id === 'tasting' ? null : menu.id, countDishes(menu.id)) +
        '</div>';
      });
      html += '</div>';
      html += '<button type="button" class="nav-item is-add" data-action="addMenu">' + icon('plus', 16) + '<span class="nav-name">Add a menu</span></button>';
      html += '<div class="side-label">Restaurant</div>';
      html += navItemHtml('Events', 'calendar', 'events', null, appData.events.length);
      html += navItemHtml('Photos & Videos', 'image', 'media', null, collectMedia().filter(function (m) { return m.isUpload; }).length);
      html += navItemHtml('Contact & Hours', 'pin', 'contact');
      html += '<div class="side-label">Admin</div>';
      html += navItemHtml('Settings & Backup', 'sliders', 'settings');
      html += '<button type="button" class="nav-item" data-action="lock">' + icon('lock') + '<span class="nav-name">Sign out</span></button>';
      $('sideNav').innerHTML = html;
    }

    /* ========================================================
       PAGE ROUTING
       ======================================================== */
    function render() {
      renderSide();
      renderPage();
      $('page').scrollTop = 0;
    }

    function renderPage() {
      var pages = {
        home: homeHtml, menu: menuHtml, dish: dishHtml, tasting: tastingHtml,
        events: eventsHtml, event: eventHtml, media: mediaHtml, contact: contactHtml, settings: settingsHtml
      };
      var notice = storageFailed
        ? '<div class="note is-bad">This computer ran out of storage, so your latest changes may be lost if you close this page. Publish now, or remove some uploaded photos.</div>'
        : '';
      $('page').innerHTML = '<div class="page">' + notice + pages[view.page]() + '</div>';
      if (view.page === 'menu') applyMenuFilters();
    }

    function go(page, menuId) {
      closeEditor();
      view.page = page;
      view.menuId = menuId || null;
      render();
      showPreviewForPage();
    }

    function pageHead(title, text, actionsHtml) {
      return '<div class="page-head"><div><h1>' + esc(title) + '</h1>' + (text ? '<p>' + esc(text) + '</p>' : '') + '</div>' +
        (actionsHtml ? '<div class="page-actions">' + actionsHtml + '</div>' : '') + '</div>';
    }

    /* ========================================================
       OVERVIEW PAGE
       ======================================================== */
    function eventDate(ev) {
      var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ev.dateStr || ''));
      return parts ? new Date(parseInt(parts[1], 10), parseInt(parts[2], 10) - 1, parseInt(parts[3], 10)) : null;
    }

    function eventState(ev) {
      var date = eventDate(ev);
      if (!date) return 'nodate';
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      return date < today ? 'past' : 'upcoming';
    }

    function findIssues() {
      var issues = [];
      var byName = {};
      allDishes().forEach(function (d) {
        if (!dishPriceText(d.item)) {
          issues.push({ text: '<b>' + esc(d.item.name) + '</b> on ' + esc(d.area) + ' has no price.', links: [d] });
        }
        var key = String(d.item.name || '').trim().toLowerCase();
        (byName[key] = byName[key] || []).push(d);
      });
      Object.keys(byName).forEach(function (key) {
        var group = byName[key];
        var prices = group.map(function (d) { return dishPriceText(d.item); }).filter(Boolean);
        var differ = prices.some(function (p) { return p !== prices[0]; });
        if (group.length > 1 && differ) {
          issues.push({
            text: '<b>' + esc(group[0].item.name) + '</b> has different prices: ' + group.map(function (d) {
              return esc(d.area) + ' ' + esc(dishPriceText(d.item) || 'no price');
            }).join(', ') + '.',
            links: group
          });
        }
      });
      var oldEvents = appData.events.filter(function (ev) { return eventState(ev) !== 'upcoming'; });
      if (oldEvents.length) {
        issues.push({ text: '<b>' + plural(oldEvents.length, 'event') + '</b> ' + (oldEvents.length === 1 ? 'is' : 'are') + ' in the past or ' + (oldEvents.length === 1 ? 'has' : 'have') + ' no year, but still ' + (oldEvents.length === 1 ? 'shows' : 'show') + ' under Upcoming Events.', events: true });
      }
      if (dataSize() > DATA_SIZE_LIMIT_BYTES) {
        issues.push({ text: '<b>Your uploaded photos are taking a lot of space.</b> Every new visitor downloads them. Delete the ones you can live without.', media: true });
      }
      return issues;
    }

    function homeHtml() {
      var issues = findIssues();
      var issuesHtml = issues.length ? issues.map(function (issue) {
        var links = '';
        if (issue.links) {
          links = issue.links.map(function (d) {
            return '<button type="button" class="btn btn-sm" data-action="openDish" data-menu="' + esc(d.menuId) + '" data-id="' + esc(d.item.id) + '">Fix on ' + esc(d.area) + '</button>';
          }).join('');
        } else if (issue.events) {
          links = '<button type="button" class="btn btn-sm" data-action="go" data-page="events">Review events</button>';
        } else if (issue.media) {
          links = '<button type="button" class="btn btn-sm" data-action="go" data-page="media">Review photos</button>';
        }
        return '<div class="issue"><p>' + issue.text + '</p><div class="issue-actions">' + links + '</div></div>';
      }).join('') : '<p class="all-good">' + icon('check') + 'Nothing needs your attention.</p>';

      return pageHead('Welcome back', 'Here is how to update your website, and anything that needs a look.') +
        '<section class="card card-pad">' +
          '<h2 class="card-title">How it works</h2>' +
          '<div class="steps">' +
            '<div class="step"><span class="step-num">1</span><b>Choose</b><span>Pick what to change: a menu, Events or Contact.</span></div>' +
            '<div class="step"><span class="step-num">2</span><b>Edit</b><span>Changes save by themselves and show in the phone preview.</span></div>' +
            '<div class="step"><span class="step-num">3</span><b>Publish</b><span>Guests see nothing new until you press Publish at the top.</span></div>' +
          '</div>' +
        '</section>' +
        '<section class="card card-pad">' +
          '<h2 class="card-title">Needs your attention' + (issues.length ? ' (' + issues.length + ')' : '') + '</h2>' +
          '<div>' + issuesHtml + '</div>' +
        '</section>';
    }

    /* ========================================================
       MENU PAGE
       ======================================================== */
    function dishRowHtml(menuId, item) {
      var thumb = item.image
        ? '<span class="thumb"><img src="' + esc(item.image) + '" alt="" loading="lazy" /></span>'
        : '<span class="thumb">' + icon('plate') + '</span>';
      var chips = '';
      if (isVegDish(item)) chips += '<span class="chip chip-veg">Vegetarian</span>';
      var price = dishPriceText(item);
      if (hasCuts(item) && item.cuts.length > 2) price = 'From ' + item.cuts.map(function (c) { return c.price; }).filter(Boolean).sort(function (a, b) {
        return parseInt(a.replace(/,/g, ''), 10) - parseInt(b.replace(/,/g, ''), 10);
      })[0];
      var search = esc(String((item.name || '') + ' ' + (item.desc || '')).toLowerCase());
      return '<div class="row" data-sort-item="' + esc(item.id) + '" data-search="' + search + '">' +
        dragHandleHtml(item.name || 'this dish') +
        '<button type="button" class="row-main" data-action="openDish" data-menu="' + esc(menuId) + '" data-id="' + esc(item.id) + '">' +
          thumb +
          '<span class="row-text">' +
            '<span class="row-name">' + esc(item.name || 'Unnamed dish') + chips + '</span>' +
            '<span class="row-sub">' + esc(item.desc || '') + '</span>' +
          '</span>' +
          '<span class="row-price' + (price ? '' : ' is-missing') + '">' + esc(price || 'No price') + '</span>' +
        '</button>' +
      '</div>';
    }

    function menuHtml() {
      var menuId = view.menuId;
      var menu = getMenu(menuId);
      if (!menu) return pageHead('This menu no longer exists');
      var sections = getSections(menuId);
      var total = countDishes(menuId);

      var head = pageHead(prettyName(menu.name), dishCountText(total) + ' on this menu. Click a dish to change it, or drag the dots to rearrange.',
        '<button type="button" class="btn" data-action="renameMenu">Rename</button>' +
        (isSystemMenu(menuId) ? '' : '<button type="button" class="btn btn-danger" data-action="deleteMenu">Delete menu</button>') +
        '<button type="button" class="btn" data-action="addSection">' + icon('plus', 16) + 'Add a section</button>' +
        '<button type="button" class="btn btn-primary" data-action="addDish" data-section="">' + icon('plus', 16) + 'Add a dish</button>');

      var hours = '';
      if (menuId === 'thebar' && appData.theGardenAndBar[0]) {
        hours = '<div class="card card-pad"><div class="field"><label for="barHours">Hours shown on this menu</label>' +
          '<input type="text" id="barHours" value="' + esc(appData.theGardenAndBar[0].subtitle) + '" placeholder="Daily | 06:00 PM – 10:30 PM" /></div></div>';
      }

      var notLive = liveData && !getMenu(menuId, liveData)
        ? '<div class="note is-info">This menu is in the phone preview now. Guests will see it after you press Publish.</div>'
        : '';

      var search = '<div class="search">' + icon('search') + '<input type="search" id="menuSearch" placeholder="Find a dish on this menu" aria-label="Find a dish on this menu" autocomplete="off" /></div>';

      var canMoveSections = sections.filter(function (s) { return s.canEdit; }).length > 1;
      var chosen = chosenSection(menuId);
      function pillHtml(label, count, key) {
        var active = chosen === key;
        return '<button type="button" class="section-pill' + (active ? ' is-active' : '') + '" data-action="sectionPill"' +
          (key === null ? '' : ' data-section="' + esc(key) + '"') + ' aria-pressed="' + active + '">' +
          esc(label) + ' <span class="count">' + count + '</span></button>';
      }
      // Pills only appear when there is more than one section to choose between
      var pills = sections.length > 1
        ? '<div class="section-pills" role="group" aria-label="Show one section">' + pillHtml('All', total, null) +
            sections.map(function (s) { return pillHtml(s.name, s.items.length, s.key); }).join('') +
          '</div>'
        : '';

      var sectionsHtml = sections.map(function (section) {
        var tools = '<button type="button" class="btn-link" data-action="addDish" data-section="' + esc(section.key) + '">Add here</button>';
        if (section.canEdit) {
          tools += '<button type="button" class="btn-link" data-action="renameSection" data-section="' + esc(section.key) + '">Rename</button>' +
            '<button type="button" class="btn-link danger" data-action="deleteSection" data-section="' + esc(section.key) + '">Delete</button>';
        }
        var handle = section.canEdit && canMoveSections ? dragHandleHtml(section.name + ' section') : '';
        return '<section class="card menu-section" data-section-key="' + esc(section.key) + '" ' + (section.canEdit ? 'data-sort-item="' + esc(section.key) + '"' : 'data-sort-tail') + '>' +
          '<div class="section-head"><div class="section-title">' + handle + '<div><h2>' + esc(section.name) + '</h2><span>' + dishCountText(section.items.length) + '</span></div></div><div class="section-tools">' + tools + '</div></div>' +
          '<div class="sort-list" data-sort-list="' + esc(section.key) + '" data-sort-group="dishes">' +
            (section.items.length
              ? section.items.map(function (item) { return dishRowHtml(menuId, item); }).join('')
              : '<p class="empty">No dishes here yet.</p>') +
          '</div>' +
        '</section>';
      }).join('');

      return head + notLive + hours + search + pills +
        '<div class="menu-sections" data-sort-list="sections" data-sort-group="sections">' + sectionsHtml + '</div>';
    }

    // The section picked with a pill, or null for All. Forgets one that no longer exists.
    function chosenSection(menuId) {
      var key = view.sectionFilter[menuId];
      if (key === undefined) return null;
      var sections = getSections(menuId);
      var exists = sections.length > 1 && sections.some(function (s) { return s.key === key; });
      if (!exists) delete view.sectionFilter[menuId];
      return exists ? key : null;
    }

    function applyMenuFilters() {
      var input = $('menuSearch');
      var q = input ? input.value.trim().toLowerCase() : '';
      var chosen = chosenSection(view.menuId);
      document.querySelectorAll('#page .menu-section').forEach(function (section) {
        var visible = 0;
        section.querySelectorAll('.row').forEach(function (row) {
          var match = !q || row.getAttribute('data-search').indexOf(q) !== -1;
          row.hidden = !match;
          if (match) visible++;
        });
        var inPill = chosen === null || section.getAttribute('data-section-key') === chosen;
        section.hidden = !inPill || (!!q && visible === 0);
      });
      var page = document.querySelector('#page .page');
      // Rearranging a searched list would be confusing, so the dots go away while searching
      page.classList.toggle('is-filtered', !!q);
      page.classList.toggle('is-one-section', chosen !== null);
    }

    function pickSectionPill(el) {
      var menuId = view.menuId;
      if (el.hasAttribute('data-section')) view.sectionFilter[menuId] = el.getAttribute('data-section');
      else delete view.sectionFilter[menuId];
      document.querySelectorAll('#page .section-pill').forEach(function (pill) {
        var active = pill === el;
        pill.classList.toggle('is-active', active);
        pill.setAttribute('aria-pressed', String(active));
      });
      applyMenuFilters();
      showPreviewForPage();
    }

    function addMenu() {
      askText('Add a menu', 'Menu name', '', 'For example: Breakfast & Brunch').then(function (name) {
        if (!name) return;
        var id = 'cat-' + Date.now();
        appData.menuCategories.push({ id: id, name: name, subtitle: '', icon: 'alacarte', type: 'custom', isSystem: false, items: [], subCategories: [] });
        appData.subCategories[id] = [];
        touch();
        go('menu', id);
        toast('Menu added. Add dishes, then press Publish.');
      });
    }

    function renameMenu() {
      var menu = getMenu(view.menuId);
      askText('Rename this menu', 'Menu name', prettyName(menu.name)).then(function (name) {
        if (!name) return;
        menu.name = name;
        touch();
        render();
      });
    }

    function deleteMenu() {
      var menu = getMenu(view.menuId);
      var count = countDishes(menu.id);
      askConfirm('Delete ' + prettyName(menu.name) + '?', count ? 'Its ' + dishCountText(count) + ' will be deleted too.' : 'This menu is empty.', 'Delete menu', true).then(function (yes) {
        if (!yes) return;
        appData.menuCategories = appData.menuCategories.filter(function (c) { return c.id !== menu.id; });
        delete appData.subCategories[menu.id];
        touch();
        go('home');
      });
    }

    function addSection() {
      var menuId = view.menuId;
      var isCourse = menuId === 'alacarte';
      askText(isCourse ? 'Add a course' : 'Add a section', 'Name', '', 'For example: Signature Burgers').then(function (name) {
        if (!name) return;
        var taken = getSections(menuId).some(function (s) { return s.name.toLowerCase() === name.toLowerCase(); });
        if (taken) {
          toast('There is already a section called ' + name + '.');
          return;
        }
        if (isGroupMenu(menuId)) {
          var key = slugify(name) || 'section-' + Date.now();
          menuGroups(menuId).push({ key: key, title: name.toUpperCase(), category: name, items: [] });
        }
        if (menuId !== 'thebar') sectionNames(menuId).push(name);
        syncCustomSections(menuId);
        touch();
        render();
      });
    }

    function syncCustomSections(menuId) {
      var menu = getMenu(menuId);
      if (menu && !isSystemMenu(menuId)) menu.subCategories = sectionNames(menuId).slice();
    }

    function renameSection(el) {
      var menuId = view.menuId;
      var key = el.getAttribute('data-section');
      var section = getSections(menuId).find(function (s) { return s.key === key; });
      askText('Rename this section', 'Name', section.name).then(function (name) {
        if (!name || name === section.name) return;
        if (isGroupMenu(menuId)) {
          var group = menuGroups(menuId).find(function (g) { return g.key === key; });
          group.category = name;
          if (group.title) group.title = name.toUpperCase();
        }
        var names = sectionNames(menuId);
        var idx = names.indexOf(section.name);
        if (idx !== -1) names[idx] = name;
        section.items.forEach(function (item) {
          if (item.subCategory === section.name) item.subCategory = name;
        });
        if (!isGroupMenu(menuId) && view.sectionFilter[menuId] === section.name) view.sectionFilter[menuId] = name;
        syncCustomSections(menuId);
        touch();
        render();
      });
    }

    function deleteSection(el) {
      var menuId = view.menuId;
      var key = el.getAttribute('data-section');
      var section = getSections(menuId).find(function (s) { return s.key === key; });
      var isGroup = isGroupMenu(menuId);
      var count = section.items.length;
      var others = isGroup ? menuGroups(menuId).filter(function (g) { return g.key !== key; }) : [];
      if (isGroup && !others.length) {
        toast('A menu needs at least one section.');
        return;
      }
      var text = !count ? 'This section is empty.'
        : (isGroup
          ? 'Its ' + dishCountText(count) + ' will move to ' + (others[0].category || others[0].key) + '.'
          : 'Its ' + dishCountText(count) + ' will stay on the menu without a section.');
      askConfirm('Delete ' + section.name + '?', text, 'Delete section', true).then(function (yes) {
        if (!yes) return;
        if (isGroup) {
          var group = menuGroups(menuId).find(function (g) { return g.key === key; });
          group.items.forEach(function (item) {
            if (item.subCategory === section.name) item.subCategory = others[0].category;
            others[0].items.push(item);
          });
          if (menuId === 'alacarte') appData.aLaCarte = others; else appData.theGardenAndBar = others;
        } else {
          section.items.forEach(function (item) { item.subCategory = ''; });
        }
        var names = sectionNames(menuId);
        var idx = names.indexOf(section.name);
        if (idx !== -1) names.splice(idx, 1);
        syncCustomSections(menuId);
        touch();
        render();
      });
    }

    /* ========================================================
       DISH EDITOR
       ======================================================== */
    function closeEditor() {
      var ed = view.editor;
      if (!ed) return;
      if (ed.kind === 'dish') {
        var found = findDish(ed.menuId, ed.id);
        if (found && !String(found.item.name || '').trim()) {
          if (ed.isNew) found.list.splice(found.index, 1);
          else if (ed.snapshot) found.item.name = ed.snapshot.name;
        }
      } else if (ed.kind === 'event') {
        var idx = appData.events.findIndex(function (ev) { return ev.id === ed.id; });
        if (idx !== -1 && !String(appData.events[idx].title || '').trim()) {
          if (ed.isNew) appData.events.splice(idx, 1);
          else if (ed.snapshot) appData.events[idx].title = ed.snapshot.title;
        }
      }
      view.editor = null;
      touch();
    }

    function extrasOf(item) {
      var list = [];
      if (Array.isArray(item.metaList) && item.metaList.length) list = item.metaList;
      else if (item.meta && Array.isArray(item.meta.items) && item.meta.items.length) list = item.meta.items;
      else if (item.meta && item.meta.text) list = [item.meta];
      return list.map(function (m) {
        return { badge: m.badge || 'ADD-ONS', text: String(m.text || '').replace(/<\/?strong>/g, '') };
      });
    }

    function writeExtras(item, extras) {
      var rows = extras.filter(function (x) { return String(x.text || '').trim(); }).map(function (x) {
        return {
          badge: String(x.badge || 'ADD-ONS').trim().toUpperCase(),
          text: x.text.trim().replace(/LKR\s*[\d,]+/g, '<strong>$&</strong>')
        };
      });
      item.metaList = rows;
      item.meta = rows[0] || null;
    }

    function priceTypeOf(item) {
      if (hasCuts(item)) return 'list';
      return item.price2 ? 'two' : 'one';
    }

    function openDish(menuId, dishId) {
      closeEditor();
      var found = findDish(menuId, dishId);
      if (!found) return;
      view.page = 'dish';
      view.menuId = menuId;
      view.editor = {
        kind: 'dish',
        menuId: menuId,
        id: dishId,
        isNew: false,
        snapshot: clone(found.item),
        originList: found.list,
        originIndex: found.index,
        priceType: priceTypeOf(found.item),
        extras: extrasOf(found.item),
        background: found.item.video ? 'video' : (found.item.image ? 'photo' : 'none')
      };
      render();
      showPreviewForPage();
    }

    function addDish(el) {
      var menuId = view.menuId;
      var sectionKey = el.getAttribute('data-section') || chosenSection(menuId) || '';
      closeEditor();
      var item = {
        id: (menuId === 'lunch' ? 'lunch-' : 'dish-') + Date.now(),
        name: '', desc: '', price: '', priceLabel: '', price2: '', price2Label: '', image: '', video: '', meta: null, metaList: []
      };
      var list;
      if (isGroupMenu(menuId)) {
        var groups = menuGroups(menuId);
        var group = groups.find(function (g) { return g.key === sectionKey; }) || groups[0];
        item.tags = [];
        item.subCategory = group.category || '';
        list = group.items;
      } else {
        item.isVeg = false;
        item.subCategory = sectionKey || sectionNames(menuId)[0] || '';
        list = menuList(menuId);
      }
      list.push(item);
      view.page = 'dish';
      view.menuId = menuId;
      view.editor = {
        kind: 'dish', menuId: menuId, id: item.id, isNew: true, snapshot: null, originList: list,
        originIndex: list.length - 1, priceType: 'one', extras: [], background: 'none'
      };
      render();
      showPreviewForPage();
      $('dishName').focus();
    }

    function editorDish() {
      var ed = view.editor;
      return ed && ed.kind === 'dish' ? findDish(ed.menuId, ed.id) : null;
    }

    function sectionOptionsHtml(menuId, found) {
      var current = isGroupMenu(menuId) ? (found.group ? found.group.key : '') : (found.item.subCategory || '');
      var sections = getSections(menuId).filter(function (s) { return s.key !== ''; });
      var html = sections.map(function (s) {
        return '<option value="' + esc(s.key) + '"' + (s.key === current ? ' selected' : '') + '>' + esc(s.name) + '</option>';
      }).join('');
      if (!isGroupMenu(menuId)) html = '<option value=""' + (current ? '' : ' selected') + '>No section</option>' + html;
      return html + '<option value="__new">Add a new section…</option>';
    }

    function pricePartHtml(item) {
      var type = view.editor.priceType;
      if (type === 'one') {
        return '<div class="field"><label for="dishPrice">Price (LKR)</label>' +
          '<input type="text" id="dishPrice" inputmode="numeric" data-dish="price" data-price value="' + esc(item.price) + '" placeholder="2,800" /></div>';
      }
      if (type === 'two') {
        return '<div class="repeat-list">' +
          '<div class="repeat-row repeat-two"><input type="text" aria-label="First option name" data-dish="priceLabel" value="' + esc(item.priceLabel) + '" placeholder="Single" />' +
          '<input type="text" aria-label="First price" inputmode="numeric" data-dish="price" data-price value="' + esc(item.price) + '" placeholder="2,200" /></div>' +
          '<div class="repeat-row repeat-two"><input type="text" aria-label="Second option name" data-dish="price2Label" value="' + esc(item.price2Label) + '" placeholder="Double" />' +
          '<input type="text" aria-label="Second price" inputmode="numeric" data-dish="price2" data-price value="' + esc(item.price2) + '" placeholder="3,800" /></div>' +
        '</div>';
      }
      var rows = (item.cuts || []).map(function (cut, i) {
        return '<div class="repeat-row repeat-price">' +
          '<input type="text" aria-label="Option name" data-cut="origin" data-i="' + i + '" value="' + esc(cut.origin) + '" placeholder="AUSTRALIA · Grain-Fed Angus" />' +
          '<input type="text" aria-label="Price" inputmode="numeric" data-cut="price" data-price data-i="' + i + '" value="' + esc(cut.price) + '" placeholder="14,500" />' +
          '<label class="check"><input type="checkbox" data-cut="premium" data-i="' + i + '"' + (cut.premium ? ' checked' : '') + ' /><span>Premium</span></label>' +
          '<button type="button" class="btn-link danger" data-action="removeCut" data-i="' + i + '">Remove</button>' +
        '</div>';
      }).join('');
      return '<div class="repeat-list">' + rows + '</div>' +
        '<div class="add-row"><button type="button" class="btn btn-sm" data-action="addCut">' + icon('plus', 14) + 'Add a price</button></div>';
    }

    function optionsPartHtml(item) {
      var rows = (item.options || []).map(function (opt, i) {
        return '<div class="repeat-row repeat-option">' +
          '<input type="text" aria-label="Choice" data-opt="label" data-i="' + i + '" value="' + esc(opt.label) + '" placeholder="Option A: House-Made Chicken Liver Pâté" />' +
          '<label class="check"><input type="checkbox" data-opt="isVeg" data-i="' + i + '"' + (opt.isVeg ? ' checked' : '') + ' /><span>Vegetarian</span></label>' +
          '<button type="button" class="btn-link danger" data-action="removeOption" data-i="' + i + '">Remove</button>' +
        '</div>';
      }).join('');
      return '<div class="repeat-list">' + rows + '</div>' +
        '<div class="add-row"><button type="button" class="btn btn-sm" data-action="addOption">' + icon('plus', 14) + 'Add a choice</button></div>';
    }

    function extrasPartHtml() {
      var rows = view.editor.extras.map(function (extra, i) {
        return '<div class="repeat-row repeat-extra">' +
          '<input type="text" aria-label="Label" data-extra="badge" data-i="' + i + '" value="' + esc(extra.badge) + '" placeholder="ADD-ONS" />' +
          '<input type="text" aria-label="Details" data-extra="text" data-i="' + i + '" value="' + esc(extra.text) + '" placeholder="Beef Bacon (LKR 250) · Egg (LKR 150)" />' +
          '<button type="button" class="btn-link danger" data-action="removeExtra" data-i="' + i + '">Remove</button>' +
        '</div>';
      }).join('');
      return '<div class="repeat-list">' + rows + '</div>' +
        '<div class="add-row">' +
          '<button type="button" class="btn btn-sm" data-action="addExtra" data-kind="addons">' + icon('plus', 14) + 'Add-ons</button>' +
          '<button type="button" class="btn btn-sm" data-action="addExtra" data-kind="sides">' + icon('plus', 14) + 'Sides</button>' +
          '<button type="button" class="btn btn-sm" data-action="addExtra" data-kind="note">' + icon('plus', 14) + 'Other note</button>' +
        '</div>';
    }

    function photoGridHtml(current, presets) {
      var uploads = collectMedia().filter(function (m) { return m.isUpload && m.kind === 'photo'; }).map(function (m) { return m.src; });
      var isOther = current && uploads.indexOf(current) === -1 && !presets.some(function (p) { return p.src === current; });
      if (isOther) uploads.unshift(current);
      var html = uploads.map(function (src) {
        var picked = src === current;
        return '<button type="button" class="photo-pick' + (picked ? ' is-picked' : '') + '" data-action="pickPhoto" data-src="' + esc(src) + '" title="Your photo" aria-pressed="' + picked + '"><img src="' + esc(src) + '" alt="Your photo" /></button>';
      }).join('');
      html += presets.map(function (p) {
        var picked = p.src === current;
        return '<button type="button" class="photo-pick' + (picked ? ' is-picked' : '') + '" data-action="pickPhoto" data-src="' + esc(p.src) + '" title="' + esc(p.label) + '" aria-pressed="' + picked + '"><img src="' + esc(p.src) + '" alt="' + esc(p.label) + '" loading="lazy" /></button>';
      }).join('');
      return '<div class="photo-grid">' + html + '</div>';
    }

    function backgroundPartHtml(item) {
      var type = view.editor.background;
      if (type === 'photo') {
        return photoGridHtml(item.image, PHOTO_PRESETS) +
          '<div class="add-row"><label class="btn btn-sm">Upload a photo<input type="file" accept="image/*" data-upload="dish" hidden /></label></div>';
      }
      if (type === 'video') {
        var options = VIDEO_PRESETS.map(function (v) {
          return '<option value="' + esc(v.src) + '"' + (item.video === v.src ? ' selected' : '') + '>' + esc(v.label) + '</option>';
        }).join('');
        return '<div class="field"><label for="dishVideo">Video</label><select id="dishVideo">' + options + '</select>' +
          '<span class="field-hint">Videos can\'t be uploaded here because every new visitor would have to download them with the menu. To add one, put the file in the assets/video folder of the website.</span></div>';
      }
      if (view.menuId === 'lunch') {
        return '<p class="field-hint">Lunch dishes always show a background, so the website will choose a photo for this dish.</p>';
      }
      return '';
    }

      if (!found) return pageHead('This dish no longer exists');
      var item = found.item;
      var menuName = menuLabel(ed.menuId);
      var priceChoices = [['one', 'One price'], ['two', 'Two sizes'], ['list', 'List of prices']].map(function (c) {
